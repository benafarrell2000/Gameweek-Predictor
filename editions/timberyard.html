<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penalty Pundit</title>
  <meta name="description" content="Guess the number, take the penalty. An arcade football quiz.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1622;
      --panel: #0d1a28;
      --line: #1f3347;
      --blue: #8cc4f0;
      --blue-deep: #3a6f9a;
      --text: #eef4fa;
      --muted: #8fa3b8;
      --yellow: #f2c94c;
      --green: #5fd38d;
      --red: #ff6b6b;
      --street-red: #e1251b;
      --street-amber: #f0b863;
      --street-yellow: #f2cf2c;
      --pixel: "Press Start 2P", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(225, 37, 27, 0.14), transparent 28%),
        radial-gradient(circle at 88% 14%, rgba(240, 184, 99, 0.14), transparent 26%),
        radial-gradient(ellipse 70% 45% at 50% 0%, #16334d, transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "VT323", monospace;
      font-size: 22px;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    /* faint CRT scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    }

    .top {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .back {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--blue); }

    .icon-btn {
      font-family: var(--pixel);
      font-size: 9px;
      background: none;
      border: 2px solid var(--line);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .icon-btn:hover { color: var(--blue); border-color: var(--blue-deep); }

    .cabinet {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 2px solid var(--blue);
      border-radius: 16px;
      box-shadow:
        0 0 0 4px var(--bg),
        0 0 36px rgba(140, 196, 240, 0.25),
        -24px -18px 60px rgba(225, 37, 27, 0.12),
        24px -18px 60px rgba(240, 184, 99, 0.12),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      padding: 14px;
    }

    .board {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 6px 12px;
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--blue);
    }

    .pips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--line);
    }
    .pip.goal { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px var(--green); }
    .pip.miss { background: var(--red); border-color: var(--red); }
    .pip.now { border-color: var(--blue); animation: blink 1s steps(2) infinite; }
    .goals b { color: var(--yellow); }

    .screen {
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #000;
      box-shadow: 0 0 0 2px var(--line);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #071019;
    }

    .panel {
      padding: 22px 8px 8px;
      min-height: 250px;
      text-align: center;
    }

    /* buttons */
    .btn {
      font-family: var(--pixel);
      font-size: 13px;
      color: var(--bg);
      background: var(--blue);
      border: none;
      border-radius: 8px;
      padding: 16px 22px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--blue-deep);
      transition: transform 0.05s, box-shadow 0.05s, filter 0.15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-deep); }
    .btn:focus-visible, .guess:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .btn.ghost {
      background: transparent;
      color: var(--blue);
      border: 2px solid var(--blue);
      box-shadow: none;
    }
    .btn.ghost:active { transform: translateY(2px); }

    /* title screen */
    .title {
      font-family: var(--pixel);
      font-size: clamp(20px, 5vw, 34px);
      color: var(--yellow);
      text-shadow: 3px 3px 0 #b5491f, 0 0 18px rgba(242, 201, 76, 0.35);
      letter-spacing: 2px;
      line-height: 1.3;
    }
    .special {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 14px;
      padding: 7px 12px;
      border: 2px solid var(--street-red);
      border-radius: 6px;
      color: var(--street-red);
      box-shadow: 0 0 14px rgba(225, 37, 27, 0.35);
      animation: sparkle 2.4s steps(1) infinite;
    }
    .special::before, .special::after { content: "\2726"; margin: 0 8px; color: var(--yellow); }
    .tag { font-size: 28px; margin: 14px 0 18px; }
    .rules {
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: 4px 22px;
      text-align: left;
      font-size: 24px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .rules b { color: var(--text); font-weight: normal; }
    .rules b.zero { color: var(--red); }
    .best {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
    }

    /* question */
    .meta {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--blue);
      letter-spacing: 1px;
    }
    .q {
      font-size: clamp(28px, 4.6vw, 36px);
      margin: 14px auto 20px;
      max-width: 30ch;
    }
    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
    }
    .guess {
      font-family: var(--pixel);
      font-size: 22px;
      width: 160px;
      text-align: center;
      background: #06101a;
      color: var(--yellow);
      border: 2px solid var(--blue);
      border-radius: 8px;
      padding: 12px 8px;
      caret-color: var(--yellow);
    }
    .guess::placeholder { color: #2c4660; }
    .guess-wrap { display: inline-flex; align-items: center; gap: 10px; }
    .guess.has-affix { width: 120px; }
    .affix { font-family: var(--pixel); font-size: 16px; color: var(--yellow); }
    .hint { font-size: 22px; color: var(--muted); margin-top: 16px; }

    /* reveal */
    .reveal-grid {
      display: flex;
      justify-content: center;
      gap: 36px;
      flex-wrap: wrap;
      margin: 2px 0 14px;
    }
    .stat .label {
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stat .value { font-family: var(--pixel); font-size: 22px; }
    .stat.answer .value { color: var(--yellow); animation: pop 0.45s ease-out; }
    .verdict {
      font-family: var(--pixel);
      font-size: 12px;
      color: var(--blue);
      margin-bottom: 16px;
    }
    .verdict.exact { color: var(--green); }

    .meter-wrap { max-width: 440px; margin: 0 auto; }
    .meter {
      position: relative;
      height: 24px;
      border: 2px solid #000;
      border-radius: 6px;
      background: repeating-linear-gradient(90deg, #7a2630 0 8px, #8a2d38 8px 16px);
      overflow: hidden;
      box-shadow: 0 0 0 2px var(--line);
    }
    .meter .zone {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: repeating-linear-gradient(90deg, #2f9d5c 0 8px, #37ad67 8px 16px);
    }
    .meter .needle {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 4px;
      margin-left: -2px;
      background: #fff;
      box-shadow: 0 0 8px #fff;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--muted);
      margin-top: 8px;
    }

    .result { font-family: var(--pixel); font-size: 18px; margin: 20px 0 8px; animation: pop 0.4s ease-out; }
    .result.goal { color: var(--green); }
    .result.miss { color: var(--red); }
    .fact { font-size: 23px; color: var(--muted); max-width: 40ch; margin: 0 auto 18px; }

    /* end screen */
    .final {
      font-family: var(--pixel);
      font-size: clamp(30px, 7vw, 46px);
      color: var(--yellow);
      text-shadow: 3px 3px 0 #b5491f;
      margin: 12px 0 10px;
    }
    .rank { font-family: var(--pixel); font-size: 12px; color: var(--blue); }
    .recap { list-style: none; max-width: 560px; margin: 20px auto 22px; text-align: left; }
    .recap li {
      display: grid;
      grid-template-columns: 26px 1fr 54px 54px;
      gap: 10px;
      align-items: baseline;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 21px;
    }
    .recap li.head {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--muted);
      border-top: none;
    }
    .recap .ri { font-family: var(--pixel); font-size: 11px; }
    .recap .ri.g { color: var(--green); }
    .recap .ri.m { color: var(--red); }
    .recap .num { text-align: right; }
    .recap .ans { text-align: right; color: var(--yellow); }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .credit { margin-top: 18px; font-size: 20px; color: var(--muted); }
    .credit a { color: var(--blue); }

    .shake { animation: shake 0.3s; }

    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes sparkle {
      0% { color: var(--street-red); border-color: var(--street-red); box-shadow: 0 0 14px rgba(225, 37, 27, 0.35); }
      33% { color: var(--street-amber); border-color: var(--street-amber); box-shadow: 0 0 14px rgba(240, 184, 99, 0.35); }
      66% { color: var(--street-yellow); border-color: var(--street-yellow); box-shadow: 0 0 14px rgba(242, 207, 44, 0.35); }
    }
    @media (prefers-reduced-motion: reduce) { .special { animation: none; } }
    @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    @media (max-width: 560px) {
      body { padding: 14px 12px 30px; }
      .cabinet { padding: 10px; }
      .board .brand { display: none; }
      .pips { gap: 4px; }
      .pip { width: 12px; height: 12px; }
      .panel { padding-top: 18px; }
      .recap li { grid-template-columns: 22px 1fr 46px 46px; font-size: 19px; }
      .rules { font-size: 20px; gap: 4px 12px; }
      .special { font-size: 8px; letter-spacing: 1px; padding: 7px 8px; }
      .special::before, .special::after { margin: 0 4px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="soundBtn" type="button" style="margin-left:auto">SOUND ON</button>
  </header>

  <main class="cabinet">
    <div class="board">
      <span class="brand">PENALTY PUNDIT</span>
      <div class="pips" id="pips" aria-label="Penalties taken"></div>
      <span class="goals">GOALS <b id="goals">0</b></span>
    </div>
    <div class="screen">
      <canvas id="pitch" width="320" height="180" role="img" aria-label="Penalty animation"></canvas>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>


  <script>
  (() => {
    // =====================================================================
    //  SETTINGS - change these to tune the game
    // =====================================================================

    // Default scoring bands: how far either side of the right answer a guess
    // can be, and the chance of scoring the penalty. Anything further out than
    // the last band is an automatic miss. A question can override these with
    // its own `bands` list.
    const SCORING_BANDS = [
      { within: 0, chance: 100 },
      { within: 1, chance: 75 },
      { within: 2, chance: 50 },
      { within: 3, chance: 25 },
    ];

    // Name of this quiz. Change it whenever the questions change, so
    // everyone's best score starts fresh for the new set.
    const QUIZ_ID = "timberyard";

    // The questions, asked in this order.
    //   q          the question
    //   a          the answer (a whole number)
    //   unit       what the answer counts, used in "2 GOALS OUT" (singular)
    //   unitPlural optional: the plural, if it isn't just unit + "s"
    //   prefix     optional: shown before the number, e.g. "£"
    //   suffix     optional: shown after the answer box, e.g. "million"
    //   short      optional: shown after numbers in results, e.g. "m" for £72m
    //   fact       shown after the penalty
    //   bands      optional: this question's own scoring bands
    const QUESTIONS = [
      {
        q: "In which year did Harry Kane make his England debut?", a: 2015, unit: "year",
        fact: "He scored against Lithuania less than two minutes after coming on.",
        bands: [{ within: 0, chance: 100 }, { within: 1, chance: 75 }, { within: 2, chance: 50 }, { within: 3, chance: 25 }],
      },
      {
        q: "How many different clubs have won the Premier League?", a: 7, unit: "club",
        fact: "Manchester United have won it the most, with 13 titles.",
        bands: [{ within: 0, chance: 100 }, { within: 1, chance: 75 }, { within: 2, chance: 50 }, { within: 3, chance: 25 }],
      },
      {
        q: "In what year did Chelsea win their first league title?", a: 1955, unit: "year",
        fact: "It came in the club's 50th year, under manager Ted Drake.",
        bands: [{ within: 0, chance: 100 }, { within: 1, chance: 75 }, { within: 2, chance: 50 }, { within: 3, chance: 25 }],
      },
      {
        q: "How many FA Cups have Arsenal won?", a: 14, unit: "FA Cup",
        fact: "That's more FA Cups than any other club.",
        bands: [{ within: 0, chance: 100 }, { within: 1, chance: 75 }, { within: 2, chance: 50 }, { within: 3, chance: 25 }],
      },
      {
        q: "How many days was Ange Postecoglou in charge of Nottingham Forest for?", a: 39, unit: "day",
        fact: "It's one of the shortest spells any Premier League manager has had.",
        bands: [{ within: 0, chance: 100 }, { within: 1, chance: 75 }, { within: 2, chance: 50 }, { within: 3, chance: 25 }],
      },
    ];
    const QUESTIONS_PER_GAME = QUESTIONS.length;
    const BEST_KEY = "pp-best-" + QUIZ_ID; // best score is kept per quiz

    // A number as it should be shown for a question, e.g. 72 -> "£72m"
    const show = (n, q) => `${q.prefix || ""}${n}${q.short || ""}`;
    // How far out a guess was, e.g. "2 GOALS", "£1 MILLION"
    const howFar = (n, q) => `${q.prefix || ""}${n} ${n === 1 ? q.unit : (q.unitPlural || q.unit + "s")}`.toUpperCase();

    // Old pool of year questions, kept for later. Not used in the game.
    const SPARE_QUESTIONS = [
      { q: "In what year were Chelsea founded?", a: 1905, fact: "Chelsea were founded in a pub opposite Stamford Bridge, the ground they still play at." },
      { q: "In what year were Arsenal founded?", a: 1886, fact: "They started out as Dial Square, a works team at the Royal Arsenal in Woolwich." },
      { q: "In what year were Tottenham Hotspur founded?", a: 1882, fact: "Spurs were started by schoolboys from the Hotspur Cricket Club." },
      { q: "West Ham began life as Thames Ironworks FC. In what year was it founded?", a: 1895, fact: "That's why West Ham are still nicknamed the Irons." },
      { q: "In what year were Fulham founded?", a: 1879, fact: "Fulham are London's oldest professional football club." },
      { q: "In what year were Millwall founded?", a: 1885, fact: "Millwall were formed by workers at a jam and marmalade factory on the Isle of Dogs." },
      { q: "In what year was the Football Association founded?", a: 1863, fact: "The FA was formed at the Freemasons' Tavern in Covent Garden." },
      { q: "In what year was the first FA Cup final played?", a: 1872, fact: "Wanderers beat Royal Engineers 1-0 at the Kennington Oval." },
      { q: "In what year did England win the World Cup?", a: 1966, fact: "England beat West Germany 4-2 after extra time at Wembley." },
      { q: "In what year did the first Premier League season kick off?", a: 1992, fact: "Manchester United won the first title in 1992-93." },
      { q: "Arsenal's 'Invincibles' went a whole league season unbeaten. In what year did that season end?", a: 2004, fact: "They played 38 games: 26 wins, 12 draws and no defeats." },
      { q: "In what year did Chelsea first win the Champions League?", a: 2012, fact: "They beat Bayern Munich on penalties, in Munich." },
      { q: "In what year did the new Wembley Stadium open?", a: 2007, fact: "Its famous arch is 133 metres tall." },
      { q: "In what year did Arsenal move into the Emirates Stadium?", a: 2006, fact: "They left Highbury after 93 years." },
      { q: "In what year did the Tottenham Hotspur Stadium open?", a: 2019, fact: "Its grass pitch slides away to reveal an NFL pitch underneath." },
      { q: "In what year did England's Lionesses win the Euros?", a: 2022, fact: "They beat Germany 2-1 after extra time at Wembley." },
      { q: "In what year did Leicester City win the Premier League?", a: 2016, fact: "They were 5000-1 outsiders at the start of the season." },
      { q: "In what year did Liverpool win the Champions League final in Istanbul?", a: 2005, fact: "They came back from 3-0 down at half-time against AC Milan." },
      { q: "In what year did Manchester United win the Treble?", a: 1999, fact: "Two stoppage-time goals won the Champions League final against Bayern Munich." },
      { q: "In what year did Wimbledon's 'Crazy Gang' win the FA Cup?", a: 1988, fact: "They beat Liverpool 1-0, and Dave Beasant saved a penalty in the final." },
    ];

    // =====================================================================
    //  HELPERS
    // =====================================================================

    const $ = (s) => document.querySelector(s);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const rand = (a, b) => a + Math.random() * (b - a);
    const randInt = (a, b) => Math.floor(rand(a, b + 1));
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp01 = (t) => Math.max(0, Math.min(1, t));
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    function chanceFor(diff, bandList) {
      const bands = [...(bandList || SCORING_BANDS)].sort((a, b) => a.within - b.within);
      for (const b of bands) if (diff <= b.within) return b.chance;
      return 0;
    }

    const plural = (n, unit) => `${n} ${unit}${n === 1 ? "" : "s"}`;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    };

    // =====================================================================
    //  SOUND (tiny synth, no audio files)
    // =====================================================================

    const sound = {
      ctx: null,
      on: store.get("pp-sound") !== "off",
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      },
      tone(freq, dur, { type = "square", vol = 0.08, delay = 0, slideTo = null } = {}) {
        if (!this.on || !this.ctx) return;
        const c = this.ctx, t = c.currentTime + delay;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(c.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      },
      noise(dur, { vol = 0.1, delay = 0, freq = 1200 } = {}) {
        if (!this.on || !this.ctx) return;
        const c = this.ctx, t = c.currentTime + delay;
        const len = Math.floor(c.sampleRate * dur);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = c.createBufferSource();
        s.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = freq;
        f.Q.value = 0.7;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f).connect(g).connect(c.destination);
        s.start(t);
        s.stop(t + dur + 0.02);
      },
      whistle() {
        this.tone(2100, 0.12, { vol: 0.035 });
        this.tone(2350, 0.22, { vol: 0.035, delay: 0.14 });
      },
      finalWhistle() {
        [0, 0.35, 0.7].forEach((d, i) => this.tone(2200, i === 2 ? 0.6 : 0.22, { vol: 0.035, delay: d }));
      },
      tick() { this.tone(880, 0.03, { vol: 0.025 }); },
      kick() {
        this.tone(160, 0.15, { type: "sine", vol: 0.3, slideTo: 45 });
        this.noise(0.08, { vol: 0.15, freq: 900 });
      },
      goal() {
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, { vol: 0.06, delay: i * 0.09 }));
        this.noise(1.5, { vol: 0.12, freq: 1000, delay: 0.05 });
      },
      save() {
        this.tone(320, 0.25, { type: "sawtooth", vol: 0.05, slideTo: 110 });
        this.noise(0.7, { vol: 0.05, freq: 600 });
      },
      post() {
        this.tone(1400, 0.45, { type: "triangle", vol: 0.08 });
        this.tone(1870, 0.4, { type: "triangle", vol: 0.05 });
      },
      miss() {
        this.tone(440, 0.18, { vol: 0.05 });
        this.tone(330, 0.18, { vol: 0.05, delay: 0.18 });
        this.tone(220, 0.35, { vol: 0.05, delay: 0.36 });
      },
      start() {
        [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.1, { vol: 0.05, delay: i * 0.07 }));
      },
    };

    // =====================================================================
    //  PIXEL SCENE (320 x 180 canvas, scaled up crisp)
    // =====================================================================

    const cv = $("#pitch");
    const ctx = cv.getContext("2d");
    const W = 320, H = 180;
    ctx.imageSmoothingEnabled = false;

    function R(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function disc(cx, cy, r, c) {
      ctx.fillStyle = c;
      cx = Math.round(cx);
      cy = Math.round(cy);
      for (let dy = -r; dy <= r; dy++) {
        const w = Math.floor(Math.sqrt((r + 0.5) ** 2 - dy * dy));
        ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
      }
    }

    function netShift(x, y) {
      const b = scene.bulge;
      if (!b || b.amp < 0.05) return [x, y];
      const dx = x - b.x, dy = y - b.y;
      const d2 = dx * dx + dy * dy;
      const f = b.amp * Math.exp(-d2 / 80);
      const d = Math.sqrt(d2) + 0.001;
      return [x + (dx / d) * f * 0.6, y + (dy / d) * f * 0.6 - f * 0.4];
    }

    function drawGoal() {
      R(101, 64, 118, 46, "rgba(255,255,255,0.05)");
      const net = "rgba(225,235,245,0.45)";
      for (let x = 103; x <= 217; x += 5) {

      for (let y = 67; y < 110; y += 5) {
        for (let x = 101; x < 219; x++) { const [px, py] = netShift(x, y); R(px, py, 1, 1, net); }
      }
      R(98, 111, 124, 1, "rgba(0,0,0,0.25)");
      const post = "#f4f8fc", shade = "#b9c6d3";

    }

    // Tiny pixel font. Letters are 3x4; digits are 3x5.
    const SHIRT_FONT = {

    function drawKicker(x, fy, pose, now) {
      const k = KICKER;
      // legs
      if (pose === "runA") { kickerLeg(x - 5, fy, 0); kickerLeg(x + 2, fy, 3); }
      else if (pose === "runB") { kickerLeg(x - 5, fy, 3); kickerLeg(x + 2, fy, 0); }
      else if (pose === "kick") { kickerLeg(x - 5, fy, 0); kickerLeg(x + 3, fy, 7); }
      else { kickerLeg(x - 5, fy, 0); kickerLeg(x + 2, fy, 0); }

      R(x - 7, fy - 13, 15, 5, k.jeans);         // jeans waist
      R(x - 7, fy - 13, 15, 1, k.jeansD);        // waistband
      R(x - 10, fy - 24, 21, 11, k.shirt);
      R(x + 9, fy - 24, 2, 11, k.shirtD);
      // "TRUDY" and "9" on the back of the shirt
      drawShirtText("TRUDY", x - 9, fy - 23, k.navy);
      drawShirtText("9", x - 1, fy - 18, k.navy);

      // arms
      if (pose === "celebrate") {
        const bob = Math.floor(now / 140) % 2;
        R(x - 12, fy - 34 - bob, 2, 11, k.skin); R(x + 11, fy - 34 + bob, 2, 11, k.skin);

      } else {
        const swing = pose === "runA" ? 2 : pose === "runB" ? -2 : pose === "kick" ? -3 : 0;
        R(x - 12, fy - 24, 2, 3, k.shirt); R(x - 12, fy - 21 + swing, 2, 5, k.skin);
        R(x + 11, fy - 24, 2, 3, k.shirt); R(x + 11, fy - 21 - swing, 2, 5, k.skin);
      }

      // big head (seen from behind)
      const hy = pose === "sad" ? fy - 32 : fy - 34;
      R(x - 2, fy - 26, 5, 2, k.skin);
      disc(x, hy, 9, k.hair);
      R(x - 4, hy + 7, 9, 2, k.skin);
      R(x - 10, hy, 2, 3, k.skin); R(x + 9, hy, 2, 3, k.skin);
      R(x - 4, hy - 7, 5, 1, k.hairHi); R(x - 6, hy - 5, 2, 1, k.hairHi);
    }

    function drawBall(x, y, r) {
      if (r >= 3) {
        disc(x, y, 3, "#ffffff");
        R(x - 1, y - 1, 2, 2, "#222");
        R(x + 2, y + 1, 1, 1, "#555");
        R(x - 2, y + 2, 1, 1, "#555");
      } else if (r === 2) {
        disc(x, y, 2, "#ffffff");
        R(x, y, 1, 1, "#333");
      } else {
        R(x, y, 2, 2, "#ffffff");
      }
    }

    function drawText(text, size, color, y) {
      ctx.font = `${size}px "Press Start 2P"`;
      ctx.textBaseline = "top";
      const w = ctx.measureText(text).width;
      const x = Math.round((W - w) / 2);
      ctx.fillStyle = "#000";
      ctx.fillText(text, x + 2, y + 2);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }

    // --- scene state -----------------------------------------------------

    const scene = { kick: null, banner: null, confetti: [], crowdUntil: 0, bulge: null, overlay: null };

    const RUN = 850, FLIGHT = 480, ARRIVE = RUN + FLIGHT;

    const BANNERS = {
      goal: { text: "GOAL!", color: "#f2c94c" },
      save: { text: "SAVED!", color: "#ff6b6b" },
      post: { text: "OFF THE POST!", color: "#ff6b6b" },
      over: { text: "OVER THE BAR!", color: "#ff6b6b" },
      wide: { text: "WIDE!", color: "#ff6b6b" },
    };

    function resetScene() {
      scene.kick = null;
      scene.banner = null;
      scene.bulge = null;
      scene.crowdUntil = 0;
      scene.confetti = [];
    }

    function startKick(scored) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const type = scored ? "goal" : pick(["save", "save", "post", "over", "wide"]);
      let tx, ty, kDir;
      switch (type) {
        case "goal": tx = 160 + side * randInt(26, 50); ty = randInt(70, 100); kDir = Math.random() < 0.2 ? 0 : -side; break;
        case "save": tx = 160 + side * randInt(20, 42); ty = randInt(76, 98); kDir = side; break;
        case "post": tx = side > 0 ? 220 : 99; ty = randInt(72, 100); kDir = pick([-1, 1]); break;
        case "over": tx = 160 + side * randInt(0, 40); ty = 40; kDir = pick([-1, 1, 0]); break;
        default: tx = side > 0 ? 238 : 82; ty = randInt(84, 104); kDir = pick([-1, 1]); break;
      }
      let kTx = 160, kTy = 93;
      if (type === "save") { kTx = tx - kDir * 17; kTy = ty + 10; }
      else if (kDir !== 0) { kTx = 160 + kDir * randInt(26, 40); kTy = randInt(80, 96); }

      return new Promise((resolve) => {
        scene.kick = { t0: performance.now(), type, side, tx, ty, kDir, kTx, kTy, kicked: false, arrived: false, resolved: false, resolve };
      });
    }

    function onArrive(k, now) {
      scene.banner = { ...BANNERS[k.type], t0: now };
      if (k.type === "goal") {
        sound.goal();
        scene.crowdUntil = now + 2600;
        scene.bulge = { x: k.tx, y: k.ty, amp: 6 };
        const colors = ["#f2c94c", "#8cc4f0", "#ffffff", "#5fd38d", "#ff6b6b"];
        for (let i = 0; i < 90; i++) {
          scene.confetti.push({ x: rand(20, 300), y: rand(-30, 0), vx: rand(-0.03, 0.03), vy: rand(0.02, 0.07), c: pick(colors), life: rand(1800, 2800) });
        }
      } else if (k.type === "post") sound.post();
      else if (k.type === "save") sound.save();
      else sound.miss();
    }

    // positions for the current frame
    function layout(now) {
      const out = {
        kicker: { x: 128, fy: 178, pose: "stand" },
        keeper: { mode: "stand", x: 160 + Math.round(Math.sin(now / 450) * 3), fy: 110 },
        ball: { x: 160, y: 150, r: 3, shadow: true, show: true },
      };
      const k = scene.kick;
      if (!k) return out;
      const t = now - k.t0;

      // kicker
      if (t < RUN) {
        const p = easeInOut(clamp01(t / RUN));
        out.kicker = { x: lerp(128, 148, p), fy: lerp(178, 160, p), pose: Math.floor(t / 110) % 2 ? "runA" : "runB" };
      } else if (t < RUN + 260) {
        out.kicker = { x: 148, fy: 160, pose: "kick" };
      } else {
        out.kicker = { x: 148, fy: 160, pose: k.arrived ? (k.type === "goal" ? "celebrate" : "sad") : "stand" };
      }

      // keeper
      const diveStart = RUN + 40, diveDur = 450;
      if (t < diveStart) {
        out.keeper = { mode: "stand", x: 160, fy: 110 };
      } else if (k.kDir === 0) {
        const p = clamp01((t - diveStart) / diveDur);
        out.keeper = { mode: "stand", x: 160, fy: 110 - Math.round(5 * Math.sin(Math.PI * p)) };
      } else {
        const p = clamp01((t - diveStart) / diveDur);
        if (p < 0.18) {
          out.keeper = { mode: "stand", x: 160 + k.kDir * 2, fy: 111 };
        } else {
          const e = easeOut((p - 0.18) / 0.82);
          let cx = lerp(160, k.kTx, e);
          let cy = lerp(95, k.kTy, e) - 6 * Math.sin(Math.PI * e);
          const fall = clamp01((t - diveStart - diveDur - 250) / 300);
          cy = lerp(cy, 104, easeOut(fall));
          out.keeper = { mode: "dive", x: cx, y: cy, dir: k.kDir };
        }
      }

      // ball
      if (t < RUN + 60) {
        out.ball = { x: 160, y: 150, r: 3, shadow: true, show: true };
      } else if (t < ARRIVE + 60) {
        const p = clamp01((t - RUN - 60) / FLIGHT);
        out.ball = {
          x: lerp(160, k.tx, p),
          y: lerp(150, k.ty, p) - 10 * Math.sin(Math.PI * p),
          r: p < 0.5 ? 3 : 2,
          shadow: true,
          sy: lerp(152, 111, p),
          show: true,
        };
      } else {
        const dt = t - ARRIVE - 60;
        let x = k.tx, y = k.ty, r = 2, show = true;
        switch (k.type) {
          case "goal": {
            const push = clamp01(dt / 200);
            x = k.tx + (k.tx - 160) * 0.04 * push;
            y = k.ty - 2 * push;
            if (dt > 250) y = lerp(k.ty - 2, 107, easeOut(clamp01((dt - 250) / 400)));
            break;
          }
          case "save": x = k.tx + k.side * 0.08 * dt; y = k.ty + 0.05 * dt; r = dt > 300 ? 3 : 2; break;
          case "post": x = k.tx + k.side * 0.1 * dt; y = k.ty + 0.07 * dt; r = dt > 300 ? 3 : 2; break;
          case "over": x = k.tx + k.side * 0.02 * dt; y = k.ty - 0.08 * dt; r = dt > 200 ? 1 : 2; break;
          default: x = k.tx + k.side * 0.08 * dt; y = k.ty - 0.01 * dt; break;
        }
        if (x < -10 || x > W + 10 || y < -10 || y > H + 10) show = false;
        out.ball = { x, y, r, shadow: false, show };
      }
      return out;
    }

    function update(now, dt) {
      const k = scene.kick;
      if (k) {
        const t = now - k.t0;
        if (!k.kicked && t >= RUN + 60) { k.kicked = true; sound.kick(); }
        if (!k.arrived && t >= ARRIVE + 60) { k.arrived = true; onArrive(k, now); }
        if (!k.resolved && t >= ARRIVE + 700) { k.resolved = true; k.resolve(); }
      }
      if (scene.bulge) scene.bulge.amp *= Math.pow(0.992, dt);
      scene.confetti = scene.confetti.filter((p) => (p.life -= dt) > 0 && p.y < H + 4);
      for (const p of scene.confetti) {
        p.x += p.vx * dt + Math.sin((now + p.life) / 200) * 0.15;
        p.y += p.vy * dt;
      }
    }

    function draw(now) {
      const cheer = now < scene.crowdUntil;
      drawStreet(now);
      drawGoal();
      drawBulldog(72, 113, now, cheer);
      for (const o of OLD_MEN) drawOldMan(o, 114, now, cheer);
      drawBus();

      const L = layout(now);
      if (L.keeper.mode === "dive") drawKeeperDiving(L.keeper.x, L.keeper.y, L.keeper.dir);
      else drawKeeperStanding(L.keeper.x, L.keeper.fy);

      if (L.ball.show) {
        if (L.ball.shadow) R(L.ball.x - 2, (L.ball.sy || 152) + 1, 5, 1, "rgba(0,0,0,0.35)");
        drawBall(Math.round(L.ball.x), Math.round(L.ball.y), L.ball.r);
      }

      drawKicker(Math.round(L.kicker.x), Math.round(L.kicker.fy), L.kicker.pose, now);

      for (const p of scene.confetti) R(p.x, p.y, 2, 2, p.c);

      if (scene.banner) {
        const b = scene.banner;
        const size = b.text.length > 8 ? 16 : 24;
        const color = b.text === "GOAL!" && Math.floor(now / 150) % 2 ? "#ffffff" : b.color;
        const age = now - b.t0;
        const y = age < 200 ? Math.round(lerp(-30, 22, easeOut(age / 200))) : 22;
        drawText(b.text, size, color, y);
      } else if (scene.overlay && Math.floor(now / 600) % 2 === 0) {
        drawText(scene.overlay, 16, "#f2c94c", 22);
      }
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(50, now - last);
      last = now;
      update(now, dt);
      draw(now);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // =====================================================================
    //  GAME FLOW
    // =====================================================================

    const panel = $("#panel");
    const pipsEl = $("#pips");
    const goalsEl = $("#goals");
    const soundBtn = $("#soundBtn");

    let game = { questions: [], index: 0, results: [], active: false, busy: false };

    function renderPips() {
      pipsEl.innerHTML = Array.from({ length: QUESTIONS_PER_GAME }, (_, i) => {
        const r = game.results[i];
        const cls = r ? (r.scored ? "goal" : "miss") : (game.active && i === game.index ? "now" : "");
        return `<span class="pip ${cls}"></span>`;
      }).join("");
      goalsEl.textContent = game.results.filter((r) => r.scored).length;
    }

    function bandsHtml() {
      const bands = [...SCORING_BANDS].sort((a, b) => a.within - b.within);
      const rows = bands.map((b) => {
        const label = b.within === 0 ? "Bang on" : `${b.within} either side`;
        return `<span>${label}</span><b>${b.chance}% chance of scoring</b>`;
      });
      rows.push(`<span>Further out</span><b class="zero">Missed penalty</b>`);
      return rows.join("");
    }

    function showTitle() {
      game = { questions: [], index: 0, results: [], active: false, busy: false };
      resetScene();
      scene.overlay = "PRESS START";
      const best = store.get(BEST_KEY);
      panel.innerHTML = `
        <h1 class="title">PENALTY PUNDIT</h1>
        <p class="special">STREET FOOTBALL SPECIAL</p>
        <p class="tag">Guess the Answer. Take the penalty.</p>
        <div class="rules">${bandsHtml()}</div>
        <div><button class="btn" id="startBtn" type="button">START</button></div>
        ${best !== null ? `<p class="best">YOUR BEST: ${best} / ${QUESTIONS_PER_GAME}</p>` : ""}
      `;
      $("#startBtn").addEventListener("click", startGame);
      renderPips();
    }

    function startGame() {
      sound.init();
      sound.start();
      game = {
        questions: QUESTIONS.slice(0, QUESTIONS_PER_GAME),
        index: 0,
        results: [],
        active: true,
        busy: false,
      };
      showQuestion();
    }

    function showQuestion() {
      resetScene();
      scene.overlay = null;
      renderPips();
      const q = game.questions[game.index];
      panel.innerHTML = `
        <p class="meta">QUESTION ${game.index + 1} OF ${game.questions.length}</p>
        <p class="q">${q.q}</p>
        <form id="guessForm" autocomplete="off" novalidate>
          <div class="row">
            <div class="guess-wrap">
              ${q.prefix ? `<span class="affix" aria-hidden="true">${q.prefix}</span>` : ""}
              <input id="guess" class="guess${q.prefix || q.suffix ? " has-affix" : ""}" type="text" inputmode="numeric" maxlength="4" placeholder="?" aria-label="Your answer${q.suffix ? ` in ${q.prefix || ""}${q.suffix}` : ""}">
              ${q.suffix ? `<span class="affix" aria-hidden="true">${q.suffix}</span>` : ""}
            </div>
            <button class="btn" type="submit">SHOOT</button>
          </div>
        </form>
        <p class="hint">Bang on scores for sure. The closer you are, the better your chances.</p>
      `;
      const input = $("#guess");
      input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, ""); });
      $("#guessForm").addEventListener("submit", (e) => { e.preventDefault(); submitGuess(); });
      input.focus({ preventScroll: true });
    }

    function runMeter(chance, scored) {
      const needle = $("#needle");
      let final;
      if (chance >= 100 || chance <= 0) final = rand(8, 92);
      else if (scored) final = rand(Math.min(2, chance / 2), Math.max(chance - 2, chance / 2));
      else final = rand(Math.min(chance + 2, 98), 98);
      const D = 1500, travel = 200 + final;
      return new Promise((resolve) => {
        const t0 = performance.now();
        let lastTick = 0;
        function step(now) {
          const p = clamp01((now - t0) / D);
          const s = easeOut(p) * travel;
          const m = s % 200;
          needle.style.left = (m <= 100 ? m : 200 - m) + "%";
          if (now - lastTick > 70 + p * 160 && p < 0.97) { sound.tick(); lastTick = now; }
          if (p < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    async function submitGuess() {
      if (game.busy) return;
      const input = $("#guess");
      const val = input.value.trim();
      if (!/^\d{1,4}$/.test(val)) {
        input.classList.remove("shake");
        void input.offsetWidth;
        input.classList.add("shake");
        input.focus();
        return;
      }
      game.busy = true;
      sound.init();

      const q = game.questions[game.index];
      const guess = parseInt(val, 10);
      const diff = Math.abs(guess - q.a);
      const chance = chanceFor(diff, q.bands);
      const scored = Math.random() * 100 < chance;

      sound.whistle();
      panel.innerHTML = `
        <div class="reveal-grid">
          <div class="stat"><p class="label">YOU SAID</p><p class="value">${show(guess, q)}</p></div>
          <div class="stat answer"><p class="label">ANSWER</p><p class="value">${show(q.a, q)}</p></div>
        </div>
        <p class="verdict ${diff === 0 ? "exact" : ""}">${diff === 0 ? "BANG ON!" : `${howFar(diff, q)} OUT`}</p>
        <div class="meter-wrap">
          <div class="meter"><div class="zone" style="width:${chance}%"></div><div class="needle" id="needle" style="left:0%"></div></div>
          <div class="meter-label"><span>SCORING CHANCE</span><span>${chance}%</span></div>
        </div>
        <div id="after"></div>
      `;

      await sleep(700);
      await runMeter(chance, scored);
      await sleep(250);
      await startKick(scored);

      game.results.push({ q, guess, diff, chance, scored });
      renderPips();

      const isLast = game.index >= game.questions.length - 1;
      const banner = BANNERS[scene.kick.type];
      $("#after").innerHTML = `
        <p class="result ${scored ? "goal" : "miss"}">${banner.text}</p>
        <p class="fact">${q.fact}</p>
        <button class="btn" id="nextBtn" type="button">${isLast ? "FULL TIME" : "NEXT KICK"}</button>
      `;
      const next = $("#nextBtn");
      next.addEventListener("click", () => {
        game.index++;
        if (game.index >= game.questions.length) showEnd();
        else showQuestion();
      });
      next.focus({ preventScroll: true });
      game.busy = false;
    }

    function rankFor(score, total) {
      const r = score / total;
      if (r === 1) return "PERFECT! GOLDEN BOOT";
      if (r >= 0.8) return "WORLD CLASS";
      if (r >= 0.6) return "PREMIER LEAGUE";
      if (r >= 0.4) return "CHAMPIONSHIP";
      if (r >= 0.2) return "SUNDAY LEAGUE";
      return "BACK TO TRAINING";
    }

    function showEnd() {
      game.active = false;
      resetScene();
      const total = game.questions.length;
      const score = game.results.filter((r) => r.scored).length;
      const prevBest = parseInt(store.get(BEST_KEY) || "-1", 10);
      const newBest = score > prevBest;
      if (newBest) store.set(BEST_KEY, String(score));

      sound.finalWhistle();
      scene.overlay = "FULL TIME";
      if (score / total >= 0.6) {
        scene.crowdUntil = performance.now() + 3000;
        sound.goal();
      }
      renderPips();

      const rows = game.results.map((r) => `
        <li>
          <span class="ri ${r.scored ? "g" : "m"}">${r.scored ? "O" : "X"}</span>
          <span>${r.q.q}</span>
          <span class="num">${show(r.guess, r.q)}</span>
          <span class="ans">${show(r.q.a, r.q)}</span>
        </li>`).join("");

      panel.innerHTML = `
        <p class="meta">FULL TIME</p>
        <p class="final">${score} / ${total}</p>
        <p class="rank">${rankFor(score, total)}${newBest && prevBest >= 0 ? " - NEW BEST!" : ""}</p>
        <ul class="recap">
          <li class="head"><span></span><span>QUESTION</span><span class="num">YOU</span><span class="ans">ANS</span></li>
          ${rows}
        </ul>
        <div class="actions">
          <button class="btn" id="againBtn" type="button">PLAY AGAIN</button>
          <button class="btn ghost" id="shareBtn" type="button">SHARE SCORE</button>
        </div>
      `;
      $("#againBtn").addEventListener("click", startGame);
      $("#shareBtn").addEventListener("click", () => shareScore(score, total));
      $("#againBtn").focus({ preventScroll: true });
    }

    async function shareScore(score, total) {
      const url = location.href.split("#")[0];
      const text = `I scored ${score}/${total} penalties on Penalty Pundit. Think you can beat me?`;
      const btn = $("#shareBtn");
      try {
        if (navigator.share) {
          await navigator.share({ title: "Penalty Pundit", text, url });
          return;
        }
        await navigator.clipboard.writeText(`${text} ${url}`);
        btn.textContent = "COPIED!";
      } catch (e) {
        if (e && e.name === "AbortError") return;
        btn.textContent = "COPY FAILED";
      }
      setTimeout(() => { btn.textContent = "SHARE SCORE"; }, 2000);
    }

    function renderSoundBtn() {
      soundBtn.textContent = sound.on ? "SOUND ON" : "SOUND OFF";
      soundBtn.setAttribute("aria-pressed", String(sound.on));
    }
    soundBtn.addEventListener("click", () => {
      sound.on = !sound.on;
      store.set("pp-sound", sound.on ? "on" : "off");
      if (sound.on) { sound.init(); sound.tick(); }
      renderSoundBtn();
    });

    renderSoundBtn();
    showTitle();
  })();
  </script>
</body>
</html>
