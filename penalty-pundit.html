<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Penalty Pundit</title>
  <meta name="description" content="Guess the number, take the penalty. An arcade football quiz.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1622;
      --panel: #0d1a28;
      --line: #1f3347;
      --blue: #8cc4f0;
      --blue-deep: #3a6f9a;
      --text: #eef4fa;
      --muted: #8fa3b8;
      --yellow: #f2c94c;
      --green: #5fd38d;
      --red: #ff6b6b;
      --orange: #f2994a;
      --pixel: "Press Start 2P", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: var(--bg); }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 45% at 50% 0%, #16334d, transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "VT323", monospace;
      font-size: 22px;
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    /* faint CRT scanlines */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    }

    .top {
      width: 100%;
      max-width: 760px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .back {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--muted);
      text-decoration: none;
    }
    .back:hover { color: var(--blue); }

    .icon-btn {
      font-family: var(--pixel);
      font-size: 9px;
      background: none;
      border: 2px solid var(--line);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .icon-btn:hover { color: var(--blue); border-color: var(--blue-deep); }

    .cabinet {
      width: 100%;
      max-width: 760px;
      background: var(--panel);
      border: 2px solid var(--blue);
      border-radius: 16px;
      box-shadow:
        0 0 0 4px var(--bg),
        0 0 36px rgba(140, 196, 240, 0.25),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      padding: 14px;
    }

    .board {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 6px 12px;
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--blue);
    }

    .pips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .pip {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--line);
    }
    .pip.goal { background: var(--green); border-color: var(--green); box-shadow: 0 0 8px var(--green); }
    .pip.miss { background: var(--red); border-color: var(--red); }
    .pip.now { border-color: var(--blue); animation: blink 1s steps(2) infinite; }
    .goals b { color: var(--yellow); }

    .screen {
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #000;
      box-shadow: 0 0 0 2px var(--line);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #071019;
    }

    .panel {
      padding: 22px 8px 8px;
      min-height: 250px;
      text-align: center;
    }

    /* buttons */
    .btn {
      font-family: var(--pixel);
      font-size: 13px;
      color: var(--bg);
      background: var(--blue);
      border: none;
      border-radius: 8px;
      padding: 16px 22px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--blue-deep);
      transition: transform 0.05s, box-shadow 0.05s, filter 0.15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-deep); }
    .btn:focus-visible, .guess:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .btn.ghost {
      background: transparent;
      color: var(--blue);
      border: 2px solid var(--blue);
      box-shadow: none;
    }
    .btn.ghost:active { transform: translateY(2px); }

    /* title screen */
    .title {
      font-family: var(--pixel);
      font-size: clamp(20px, 5vw, 34px);
      color: var(--yellow);
      text-shadow: 3px 3px 0 #b5491f, 0 0 18px rgba(242, 201, 76, 0.35);
      letter-spacing: 2px;
      line-height: 1.3;
    }
    /* theme "azteca": England white and red instead of light blue */
    body.theme-azteca { --blue: #f4f6fa; --blue-deep: #cf142b; }
    body.theme-azteca .cabinet {
      border-color: #f4f6fa;
      box-shadow: 0 0 0 4px var(--bg), 0 0 36px rgba(207, 20, 43, 0.32), inset 0 0 40px rgba(0, 0, 0, 0.4);
    }
    body.theme-azteca .title, body.theme-azteca .final { color: #f4f6fa; text-shadow: 3px 3px 0 #cf142b, 0 0 18px rgba(255, 255, 255, 0.2); }
    .theme-line {
      font-family: var(--pixel);
      font-size: 9px;
      line-height: 1.9;
      color: var(--muted);
      margin: 10px 0 0;
    }
    .theme-line b { color: #f4f6fa; font-weight: normal; }
    .theme-line .rc { display: inline-block; width: 6px; height: 9px; background: #e0242f; vertical-align: -1px; margin: 0 2px; }

    /* daily shootout */
    .daily {
      font-family: var(--pixel);
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--blue);
      margin-top: 14px;
      line-height: 1.6;
    }
    .lvl {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 8px;
      letter-spacing: 1px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 2px solid currentColor;
      vertical-align: middle;
    }
    .lvl.easy { color: var(--green); }
    .lvl.medium { color: var(--orange); }
    .lvl.hard { color: var(--red); }
    .levels { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 0 0 8px; }
    .hint.small { font-size: 20px; margin: 0 0 18px; }
    .hint a { color: var(--blue); }
    .countdown-big { font-family: var(--pixel); font-size: 22px; color: var(--yellow); margin: 14px 0 6px; }
    .grid { display: flex; gap: 10px; justify-content: center; margin: 14px 0 10px; }
    .ricon { display: block; image-rendering: pixelated; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font-family: var(--pixel); font-size: 7px; color: var(--muted); margin: 0 0 16px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; }
    .statbox {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 440px;
      margin: 20px auto 6px;
    }
    .statbox div { border: 2px solid var(--line); border-radius: 8px; padding: 10px 4px; }
    .statbox b { display: block; font-family: var(--pixel); font-size: 18px; color: var(--yellow); font-weight: normal; }
    .statbox span { display: block; font-family: var(--pixel); font-size: 7px; color: var(--muted); margin-top: 8px; }
    .next { font-family: var(--pixel); font-size: 10px; color: var(--muted); margin: 14px 0 0; line-height: 1.8; }
    .next b { color: var(--yellow); font-weight: normal; }
    .recap .lvl { font-size: 6px; padding: 2px 4px; border-width: 1px; }
    .tag { font-size: 28px; margin: 14px 0 18px; }
    .rules {
      display: inline-grid;
      grid-template-columns: auto auto;
      gap: 4px 22px;
      text-align: left;
      font-size: 24px;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .rules b { color: var(--text); font-weight: normal; }
    .rules b.zero { color: var(--red); }
    .best {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--muted);
      margin-top: 20px;
    }

    /* question */
    .meta {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--blue);
      letter-spacing: 1px;
    }
    .q {
      font-size: clamp(28px, 4.6vw, 36px);
      margin: 14px auto 20px;
      max-width: 30ch;
    }
    .row {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
    }
    .guess {
      font-family: var(--pixel);
      font-size: 22px;
      width: 160px;
      text-align: center;
      background: #06101a;
      color: var(--yellow);
      border: 2px solid var(--blue);
      border-radius: 8px;
      padding: 12px 8px;
      caret-color: var(--yellow);
    }
    .guess::placeholder { color: #2c4660; }
    .guess-wrap { display: inline-flex; align-items: center; gap: 10px; }
    .guess.has-affix { width: 120px; }
    .affix { font-family: var(--pixel); font-size: 16px; color: var(--yellow); }
    .hint { font-size: 22px; color: var(--muted); margin-top: 16px; }

    /* reveal */
    .reveal-grid {
      display: flex;
      justify-content: center;
      gap: 36px;
      flex-wrap: wrap;
      margin: 2px 0 14px;
    }
    .stat .label {
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .stat .value { font-family: var(--pixel); font-size: 22px; }
    .stat.answer .value { color: var(--yellow); animation: pop 0.45s ease-out; }
    .verdict {
      font-family: var(--pixel);
      font-size: 12px;
      color: var(--blue);
      margin-bottom: 16px;
    }
    .verdict.exact { color: var(--green); }

    .meter-wrap { max-width: 440px; margin: 0 auto; }
    .meter {
      position: relative;
      height: 24px;
      border: 2px solid #000;
      border-radius: 6px;
      background: repeating-linear-gradient(90deg, #7a2630 0 8px, #8a2d38 8px 16px);
      overflow: hidden;
      box-shadow: 0 0 0 2px var(--line);
    }
    .meter .zone {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      background: repeating-linear-gradient(90deg, #2f9d5c 0 8px, #37ad67 8px 16px);
    }
    .meter .needle {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 4px;
      margin-left: -2px;
      background: #fff;
      box-shadow: 0 0 8px #fff;
    }
    .meter-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--muted);
      margin-top: 8px;
    }

    .result { font-family: var(--pixel); font-size: 18px; margin: 20px 0 8px; animation: pop 0.4s ease-out; }
    .result.goal { color: var(--green); }
    .result.miss { color: var(--red); }
    .fact { font-size: 23px; color: var(--muted); max-width: 40ch; margin: 0 auto 18px; }

    /* end screen */
    .final {
      font-family: var(--pixel);
      font-size: clamp(30px, 7vw, 46px);
      color: var(--yellow);
      text-shadow: 3px 3px 0 #b5491f;
      margin: 12px 0 10px;
    }
    .rank { font-family: var(--pixel); font-size: 12px; color: var(--blue); }
    .recap { list-style: none; max-width: 640px; margin: 20px auto 22px; text-align: left; }
    .recap li {
      display: grid;
      grid-template-columns: 26px 1fr 54px 54px 60px;
      gap: 10px;
      align-items: baseline;
      padding: 6px 0;
      border-top: 1px solid var(--line);
      font-size: 21px;
    }
    .recap li.head {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--muted);
      border-top: none;
    }
    .recap .ri { align-self: center; }
    .recap .num { text-align: right; }
    .recap .ans { text-align: right; color: var(--yellow); }
    .recap .off { text-align: right; }
    .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

    .credit { margin-top: 18px; font-size: 20px; color: var(--muted); }
    .credit a { color: var(--blue); }

    .shake { animation: shake 0.3s; }

    @keyframes blink { 50% { opacity: 0.2; } }
    @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    @media (max-width: 560px) {
      body { padding: 14px 12px 30px; }
      .cabinet { padding: 10px; }
      .board .brand { display: none; }
      .pips { gap: 4px; }
      .pip { width: 12px; height: 12px; }
      .panel { padding-top: 18px; }
      .recap li { grid-template-columns: 18px 1fr 44px 44px 50px; gap: 6px; font-size: 19px; }
      .recap li.head { font-size: 7px; }
      .rules { font-size: 20px; gap: 4px 12px; }
      .daily { font-size: 8px; }
      .levels { gap: 4px; }
      .levels .lvl { font-size: 7px; padding: 3px 4px; letter-spacing: 0; }
      .statbox { gap: 6px; }
      .statbox b { font-size: 15px; }
      .statbox span { font-size: 6px; }
      .grid { font-size: 26px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="soundBtn" type="button" style="margin-left:auto">SOUND ON</button>
  </header>

  <main class="cabinet">
    <div class="board">
      <span class="brand">PENALTY PUNDIT</span>
      <div class="pips" id="pips" aria-label="Penalties taken"></div>
      <span class="goals">GOALS <b id="goals">0</b></span>
    </div>
    <div class="screen">
      <canvas id="pitch" width="320" height="180" role="img" aria-label="Penalty animation"></canvas>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>


  <script>
  (() => {
    // =====================================================================
    //  SETTINGS - change these to tune the game
    // =====================================================================

    // Default scoring bands: how far either side of the right answer a guess
    // can be, and the chance of scoring the penalty. Anything further out than
    // the last band is an automatic miss. A question can override these with
    // its own `bands` list.
    const SCORING_BANDS = [
      { within: 0, chance: 100 },
      { within: 1, chance: 75 },
      { within: 2, chance: 50 },
      { within: 3, chance: 25 },
    ];

    // =====================================================================
    //  DAILY SHOOTOUT SETUP
    // =====================================================================
    // Shootout #1 is on DAILY_START (by the player's own calendar date).
    // Every day takes the next 2 easy, 2 medium and 1 hard question from the
    // lists below, in order, so each shootout gets harder kick by kick:
    //   day 1: EASY[0], EASY[1], MEDIUM[0], MEDIUM[1], HARD[0]
    //   day 2: EASY[2], EASY[3], MEDIUM[2], MEDIUM[3], HARD[1]   ...and so on.
    // A week needs 14 easy, 14 medium and 7 hard.
    //
    // Each question:
    //   q          the question
    //   a          the answer (a whole number)
    //   unit       what the answer counts, used in "2 GOALS OUT" (singular)
    //   unitPlural optional: the plural, if it isn't just unit + "s"
    //   prefix     optional: shown before the number, e.g. "£"
    //   suffix     optional: shown after the answer box, e.g. "million"
    //   short      optional: shown after numbers in results, e.g. "m" for £72m
    //   fact       shown after the penalty
    //   bands      optional: this question's own scoring bands
    const DAILY_START = "2026-11-09";

    // Looks: which days use a special theme. Days not listed use the classic
    // night stadium. Only the look changes, never the questions or rules.
    //   "azteca" = England at the Estadio Azteca, World Cup 2026 round of 16:
    //              59:34, MEX 1-2 ENG, England down to 10 men, Kane's penalty.
    const THEME_DAYS = { "2026-11-13": "azteca", "2026-11-14": "azteca", "2026-11-15": "azteca" };
    let theme = "classic";
    // Week 1: Mon 9 - Sun 15 November 2026 (Ben's questions, in his order).
    const EASY = [
      { q: "How many Ballon d'Ors has Lionel Messi won?", a: 8, unit: "Ballon d'Or", unitPlural: "Ballon d'Ors" },
      { q: "How many Premier League titles have Manchester United won?", a: 13, unit: "title" },
      { q: "How many clubs has Pep Guardiola managed?", a: 3, unit: "club" },
      { q: "How many clubs compete in the third round of the FA Cup?", a: 64, unit: "club" },
      { q: "How many Premier League titles did Mohamed Salah win?", a: 2, unit: "title" },
      { q: "What number does Emi Martinez wear for Chelsea?", a: 1, unit: "" },
      { q: "How many European Cups have Liverpool won?", a: 6, unit: "European Cup" },
      { q: "In which year did the first French team win the European Cup?", a: 1993, unit: "year" },
      { q: "How many fingers does Dan Burn have (thumbs included)?", a: 9, unit: "finger" },
      { q: "How many goals did Jude Bellingham score at the 2026 World Cup?", a: 7, unit: "goal" },
      { q: "What number did Cristiano Ronaldo wear when he first signed for Real Madrid?", a: 9, unit: "" },
      { q: "In which year did Birmingham City win the Carling Cup?", a: 2011, unit: "year" },
      { q: "How many different countries have won the World Cup?", a: 8, unit: "country", unitPlural: "countries" },
      { q: "In which year did Manchester United win their last Premier League title?", a: 2013, unit: "year" },
    ];
    const MEDIUM = [
      { q: "What number does Phil Foden wear for Manchester City?", a: 47, unit: "" },
      { q: "How old is Gary Neville?", a: 51, unit: "year" },
      { q: "In what year did John Terry make his last Chelsea appearance?", a: 2017, unit: "year" },
      { q: "How many times have England made it to the semi-finals of the World Cup?", a: 4, unit: "semi-final" },
      { q: "In what year did Brazil win their first World Cup?", a: 1958, unit: "year" },
      { q: "How many goals has Gary Lineker scored for England?", a: 48, unit: "goal" },
      { q: "How many Premier League goals did Erling Haaland score for Manchester City in 2022-23?", a: 36, unit: "goal" },
      { q: "What was the last year a Welsh team won a major trophy?", a: 2013, unit: "year" },
      { q: "How many goals did Gareth Bale score at the 2022 World Cup?", a: 1, unit: "goal" },
      { q: "How many times have Scotland made the semi-finals of a major tournament?", a: 0, unit: "semi-final" },
      { q: "How many managers did Nottingham Forest have in the 2025/26 season?", a: 4, unit: "manager" },
      { q: "In what year did Karim Benzema win the Ballon d'Or?", a: 2022, unit: "year" },
      { q: "How many appearances did Steve Bruce make for England?", a: 0, unit: "appearance" },
      { q: "In what year did Blackpool get relegated from the Premier League?", a: 2011, unit: "year" },
    ];
    const HARD = [
      { q: "How many clubs has Hulk played for during his career?", a: 9, unit: "club" },
      { q: "How many times did Gareth Southgate play for England?", a: 57, unit: "cap" },
      { q: "In what year were Aston Villa founded?", a: 1874, unit: "year" },
      { q: "How many red cards did Roy Keane receive in his career?", a: 13, unit: "red card" },
      { q: "How many Premier League appearances has Harry Kane made?", a: 320, unit: "appearance" },
      { q: "How many goals did Marouane Fellaini score in the Premier League?", a: 37, unit: "goal" },
      { q: "How many days older than Lionel Messi is Cristiano Ronaldo?", a: 869, unit: "day" },
    ];

    const KICKS = ["easy", "easy", "medium", "medium", "hard"];
    const DAYS = Math.min(Math.floor(EASY.length / 2), Math.floor(MEDIUM.length / 2), HARD.length);

    // ---- dates (the player's own calendar day)
    const pad = (n) => String(n).padStart(2, "0");
    const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const ymd = (iso) => iso.split("-").map(Number);
    const dayNum = (iso) => { const [y, m, d] = ymd(iso); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
    const dayIndex = (iso) => dayNum(iso) - dayNum(DAILY_START);
    const addDays = (iso, n) => { const [y, m, d] = ymd(iso); return isoOf(new Date(y, m - 1, d + n)); };
    const localMidnight = (iso) => { const [y, m, d] = ymd(iso); return new Date(y, m - 1, d).getTime(); };
    const prettyDate = (iso) => {
      const [y, m, d] = ymd(iso);
      const day = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"][new Date(y, m - 1, d).getDay()];
      return `${day} ${d} ${["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"][m - 1]}`;
    };
    // Testing only: open the file on your own computer with ?day=2026-11-10 on the
    // end of the address to pretend it's that day. Ignored on the live site.
    const LOCAL = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
    const TEST_DAY = LOCAL ? new URLSearchParams(location.search).get("day") : null;
    const todayIso = () => (TEST_DAY && /^\d{4}-\d{2}-\d{2}$/.test(TEST_DAY) ? TEST_DAY : isoOf(new Date()));

    // The shootout for a date, or null if there isn't one.
    function shootoutFor(iso) {
      const i = dayIndex(iso);
      if (i < 0 || i >= DAYS) return null;
      const qs = [EASY[2 * i], EASY[2 * i + 1], MEDIUM[2 * i], MEDIUM[2 * i + 1], HARD[i]];
      return { iso, number: i + 1, questions: qs.map((q, k) => ({ ...q, level: KICKS[k] })) };
    }

    // A number as it should be shown for a question, e.g. 72 -> "£72m"
    const show = (n, q) => `${q.prefix || ""}${n}${q.short || ""}`;
    // How far out a guess was, e.g. "2 GOALS", "£1 MILLION"
    // (A question with unit "" - e.g. a shirt number - just reads "2 OUT".)
    const howFar = (n, q) => (q.unit
      ? `${q.prefix || ""}${n} ${n === 1 ? q.unit : (q.unitPlural || q.unit + "s")}`
      : `${q.prefix || ""}${n}`).toUpperCase();

    // Old pool of year questions, kept for later. Not used in the game.

    ];

    // =====================================================================
    //  HELPERS
    // =====================================================================

    const $ = (s) => document.querySelector(s);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const rand = (a, b) => a + Math.random() * (b - a);
    const randInt = (a, b) => Math.floor(rand(a, b + 1));
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const lerp = (a, b, t) => a + (b - a) * t;
    const clamp01 = (t) => Math.max(0, Math.min(1, t));
    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

    function chanceFor(diff, bandList) {
      const bands = [...(bandList || SCORING_BANDS)].sort((a, b) => a.within - b.within);
      for (const b of bands) if (diff <= b.within) return b.chance;
      return 0;
    }

    const plural = (n, unit) => `${n} ${unit}${n === 1 ? "" : "s"}`;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    };

    // =====================================================================
    //  SOUND (tiny synth, no audio files)
    // =====================================================================

    const sound = {
      ctx: null,
      on: store.get("pp-sound") !== "off",
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      },
      tone(freq, dur, { type = "square", vol = 0.08, delay = 0, slideTo = null } = {}) {
        if (!this.on || !this.ctx) return;
        const c = this.ctx, t = c.currentTime + delay;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g).connect(c.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      },
      noise(dur, { vol = 0.1, delay = 0, freq = 1200 } = {}) {
        if (!this.on || !this.ctx) return;
        const c = this.ctx, t = c.currentTime + delay;
        const len = Math.floor(c.sampleRate * dur);
        const buf = c.createBuffer(1, len, c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const s = c.createBufferSource();
        s.buffer = buf;
        const f = c.createBiquadFilter();
        f.type = "bandpass";
        f.frequency.value = freq;
        f.Q.value = 0.7;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        s.connect(f).connect(g).connect(c.destination);
        s.start(t);
        s.stop(t + dur + 0.02);
      },
      whoosh() {
        // time-jump: a falling sweep with rushing air
        this.tone(900, 0.9, { type: "sawtooth", vol: 0.03, slideTo: 60 });
        this.noise(1.1, { vol: 0.08, freq: 1400 });
      },
      roar() {
        // a big stadium crowd
        this.noise(1.8, { vol: 0.14, freq: 700 });
        this.noise(1.4, { vol: 0.06, freq: 1800, delay: 0.1 });
      },
      whistle() {
        this.tone(2100, 0.12, { vol: 0.035 });
        this.tone(2350, 0.22, { vol: 0.035, delay: 0.14 });
      },
      finalWhistle() {
        [0, 0.35, 0.7].forEach((d, i) => this.tone(2200, i === 2 ? 0.6 : 0.22, { vol: 0.035, delay: d }));
      },
      tick() { this.tone(880, 0.03, { vol: 0.025 }); },
      kick() {
        this.tone(160, 0.15, { type: "sine", vol: 0.3, slideTo: 45 });
        this.noise(0.08, { vol: 0.15, freq: 900 });
      },
      goal() {
        [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.16, { vol: 0.06, delay: i * 0.09 }));
        this.noise(1.5, { vol: 0.12, freq: 1000, delay: 0.05 });
      },
      save() {
        this.tone(320, 0.25, { type: "sawtooth", vol: 0.05, slideTo: 110 });
        this.noise(0.7, { vol: 0.05, freq: 600 });
      },
      post() {
        this.tone(1400, 0.45, { type: "triangle", vol: 0.08 });
        this.tone(1870, 0.4, { type: "triangle", vol: 0.05 });
      },
      miss() {
        this.tone(440, 0.18, { vol: 0.05 });
        this.tone(330, 0.18, { vol: 0.05, delay: 0.18 });
        this.tone(220, 0.35, { vol: 0.05, delay: 0.36 });
      },
      start() {
        [392, 523, 659, 784].forEach((f, i) => this.tone(f, 0.1, { vol: 0.05, delay: i * 0.07 }));
      },
    };

    // =====================================================================
    //  PIXEL SCENE (320 x 180 canvas, scaled up crisp)
    // =====================================================================

    const cv = $("#pitch");
    const ctx = cv.getContext("2d");
    const W = 320, H = 180;
    ctx.imageSmoothingEnabled = false;

    function R(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function disc(cx, cy, r, c) {
      ctx.fillStyle = c;
      cx = Math.round(cx);
      cy = Math.round(cy);
      for (let dy = -r; dy <= r; dy++) {
        const w = Math.floor(Math.sqrt((r + 0.5) ** 2 - dy * dy));
        ctx.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
      }
    }

    // static decoration, generated once
    const stars = Array.from({ length: 45 }, () => ({ x: randInt(0, W - 1), y: randInt(0, 48), p: rand(0, 6) }));
    const SHIRTS = ["#8cc4f0", "#ffffff", "#f2c94c", "#e05d5d", "#5fb3ff", "#c9d6e3", "#3a6f9a"];
    const SKINS = ["#f1c27d", "#e0ac69", "#c68642", "#8d5524", "#ffdbac"];
    const fans = [];
    for (let row = 0; row < 6; row++) {
      for (let x = row % 2 ? 2 : 0; x < W - 2; x += 5) {
        fans.push({ x, y: 59 + row * 6, skin: pick(SKINS), shirt: pick(SHIRTS), ph: rand(0, 6) });
      }
    }
    const blocks = [[0, 44, 18, 12], [100, 46, 12, 10], [112, 42, 9, 14], [190, 44, 14, 12], [300, 44, 20, 12], [36, 44, 26, 12]];
    const windows = [];
    blocks.forEach(([x, y, w, h]) => {
      for (let i = 0; i < 3; i++) windows.push({ x: x + randInt(1, w - 2), y: y + randInt(1, h - 3), p: rand(0, 6) });
    });
    const tufts = Array.from({ length: 40 }, () => ({ x: randInt(0, W - 1), y: randInt(112, H - 1) }));

    const SKY = ["#050c15", "#071120", "#09162a", "#0b1b33", "#0e213b", "#112743", "#142d4b"];

    function drawBackground(now) {
      SKY.forEach((c, i) => R(0, i * 8, W, 8, c));

      for (const s of stars) if (Math.sin(now / 500 + s.p) > -0.3) R(s.x, s.y, 1, 1, "#cfe6ff");

      // floodlight glow
      for (const x of [11, 309]) {
        const g = ctx.createRadialGradient(x, 6, 0, x, 6, 46);
        g.addColorStop(0, "rgba(210,235,255,0.22)");
        g.addColorStop(1, "rgba(210,235,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(x - 46, 0, 92, 60);
      }

      // London skyline
      const sk = "#1b3a57";
      blocks.forEach(([x, y, w, h]) => R(x, y, w, h, sk));
      R(18, 48, 8, 8, sk);
      // Elizabeth Tower
      R(30, 26, 6, 30, sk); R(29, 26, 8, 2, sk); R(31, 22, 4, 4, sk); R(32, 18, 2, 4, sk); R(33, 15, 1, 3, sk);
      R(32, 29, 2, 2, "#f2c94c");
      // Parliament pinnacles
      for (let x = 38; x <= 60; x += 4) R(x, 42, 1, 2, sk);
      // London Eye
      for (let a = 0; a < Math.PI * 2; a += 0.07) R(82 + Math.cos(a) * 15, 36 + Math.sin(a) * 15, 1, 1, sk);
      for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) R(82 + Math.cos(a) * 15 - 1, 36 + Math.sin(a) * 15 - 1, 2, 2, sk);
      R(81, 35, 2, 2, sk);
      for (let i = 0; i <= 20; i++) { R(82 - i * 0.35, 36 + i, 1, 1, sk); R(82 + i * 0.35, 36 + i, 1, 1, sk); }
      // St Paul's
      R(126, 46, 22, 10, sk); disc(137, 45, 6, sk); R(136, 36, 2, 4, sk); R(135, 33, 4, 1, sk); R(136, 31, 2, 4, sk);
      // Gherkin
      for (let y = 34; y < 56; y++) {
        const hw = Math.floor(5 * Math.sqrt(Math.max(0, 1 - ((y - 46) / 12) ** 2)));
        R(165 - hw, y, hw * 2 + 1, 1, sk);
      }
      // Walkie-Talkie
      R(176, 40, 10, 16, sk); R(175, 38, 12, 2, sk);
      // The Shard
      for (let y = 18; y < 56; y++) {
        const hw = Math.floor((y - 18) * 0.22);
        R(222 - hw, y, hw * 2 + 1, 1, sk);
      }
      // Tower Bridge
      R(252, 36, 6, 20, sk); R(276, 36, 6, 20, sk);
      R(253, 32, 4, 4, sk); R(254, 30, 2, 2, sk); R(277, 32, 4, 4, sk); R(278, 30, 2, 2, sk);
      R(258, 39, 18, 1, sk); R(258, 41, 18, 1, sk); R(238, 50, 60, 2, sk);
      for (let i = 0; i <= 12; i++) { R(252 - i, 37 + i, 1, 1, sk); R(281 + i, 37 + i, 1, 1, sk); }

      for (const w of windows) if (Math.sin(now / 900 + w.p) > -0.6) R(w.x, w.y, 1, 1, "#e9c46a");

      // floodlight towers
      R(10, 6, 2, 52, "#22384d"); R(4, 1, 15, 6, "#2a4560");
      R(5, 2, 3, 3, "#f4fbff"); R(10, 2, 3, 3, "#f4fbff"); R(15, 2, 3, 3, "#f4fbff");
      R(308, 6, 2, 52, "#22384d"); R(301, 1, 15, 6, "#2a4560");
      R(302, 2, 3, 3, "#f4fbff"); R(307, 2, 3, 3, "#f4fbff"); R(312, 2, 3, 3, "#f4fbff");
    }

    function drawStand(now) {
      R(0, 56, W, 38, "#0c1a28");
      R(0, 56, W, 2, "#1d3247");
      const jumping = now < scene.crowdUntil;
      for (const f of fans) {
        let dy = 0;
        if (jumping) dy = Math.sin(now / 90 + f.ph) > 0 ? -2 : 0;
        else if (Math.sin(now / 700 + f.ph) > 0.93) dy = -1;
        R(f.x, f.y + 2 + dy, 3, 3, f.shirt);
        R(f.x, f.y + dy, 2, 2, f.skin);
        if (jumping) { R(f.x - 1, f.y - 1 + dy, 1, 2, f.skin); R(f.x + 3, f.y - 1 + dy, 1, 2, f.skin); }
      }
    }

    function drawBoards(now) {
      R(0, 94, W, 10, "#06101a");
      R(0, 94, W, 1, "#8cc4f0");
      ctx.font = '8px "Press Start 2P"';

      const msg = goalFlash ? "GOAL!  GOAL!  GOAL!  " : "PENALTY PUNDIT  *  DAILY SHOOTOUT  *  GUESS IT  *  SCORE IT  *  ";
      ctx.fillStyle = goalFlash ? (Math.floor(now / 150) % 2 ? "#f2c94c" : "#ffffff") : "#8cc4f0";
      const mw = Math.max(1, ctx.measureText(msg).width);
