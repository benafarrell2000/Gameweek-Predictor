      for (let x = -off; x < W; x += mw) ctx.fillText(msg, Math.round(x), 95);
    }

    function drawPitch() {
      for (let y = 104, i = 0; y < H; y += 10, i++) R(0, y, W, 10, i % 2 ? "#2c8a45" : "#329a4d");
      for (const t of tufts) R(t.x, t.y, 1, 1, "#287c3e");
      const line = "#e8f5ea";
      R(16, 110, 288, 1, line);
      R(80, 110, 1, 13, line); R(240, 110, 1, 13, line); R(80, 123, 161, 1, line);
      R(34, 110, 1, 52, line); R(286, 110, 1, 52, line); R(34, 162, 253, 1, line);
      R(159, 149, 3, 2, line);
    }

    // =====================================================================
    //  THEME "azteca": England at the Estadio Azteca, World Cup 2026, R16.
    //  59:34, MEX 1-2 ENG, England down to 10 men (Quansah red, 54').
    //  Every kick is Kane's 60th-minute penalty to make it 1-3.
    // =====================================================================
    const AZ_ENG_END = 70; // the England end is the left of the stand
    const AZ_UPPER = [];
    for (let y = 25; y < 47; y += 2) {
      for (let x = (y / 2) % 2 ? 1 : 0; x < W; x += 2) {
        const eng = x < AZ_ENG_END;
        AZ_UPPER.push({ x, y, c: eng ? pick(["#f4f6fa", "#f4f6fa", "#cf142b", "#c9ced6"]) : pick(["#1f7a3a", "#1f7a3a", "#2a9a4a", "#145a2a", "#f4f6fa", "#c8102e"]) });
      }
    }
    const AZ_FANS = [];
    for (let row = 0; row < 6; row++) {
      for (let x = row % 2 ? 2 : 0; x < W - 2; x += 5) {
        const eng = x < AZ_ENG_END;
        AZ_FANS.push({
          x, y: 59 + row * 6, eng, skin: pick(SKINS), ph: rand(0, 6),
          shirt: eng ? pick(["#f4f6fa", "#f4f6fa", "#cf142b", "#1b2b55"]) : pick(["#1f7a3a", "#1f7a3a", "#2a9a4a", "#145a2a", "#f4f6fa", "#c8102e"]),
        });
      }
    }
    const AZ_FLAGS = [
      { x: 12, y: 62, eng: true, ph: 0.4 }, { x: 46, y: 70, eng: true, ph: 2.2 },
      { x: 92, y: 64, eng: false, ph: 1.1 }, { x: 146, y: 60, eng: false, ph: 3.3 },
      { x: 236, y: 66, eng: false, ph: 0.8 }, { x: 288, y: 61, eng: false, ph: 2.7 },
    ];
    const AZ_CLOUDS = [[20, 3, 40, 3], [96, 6, 52, 3], [190, 2, 36, 2], [252, 7, 44, 3]];

    function drawAztecaFlag(f, now) {
      R(f.x, f.y, 1, 14, "#8a8f99"); // pole
      for (let i = 0; i < 12; i++) {
        const wave = Math.round(Math.sin(now / 180 + f.ph + i * 0.6) * 1.2);
        let c;
        if (f.eng) c = i === 5 || i === 6 ? "#cf142b" : "#f4f6fa";
        else c = i < 4 ? "#1f7a3a" : i < 8 ? "#f4f6fa" : "#c8102e";
        R(f.x + 1 + i, f.y + wave, 1, 7, c);
        if (f.eng) R(f.x + 1 + i, f.y + 3 + wave, 1, 1, "#cf142b"); // St George's cross
        else if (i === 5 || i === 6) R(f.x + 1 + i, f.y + 3 + wave, 1, 1, "#7a5a2a"); // emblem
      }
    }

    function drawAztecaScreen() {
      const x0 = 206, y0 = 26, w = 104, h = 21;
      R(x0 - 1, y0 - 1, w + 2, h + 2, "#3a3f48");
      R(x0, y0, w, h, "#05070b");
      const eng = scene.engScored ? 3 : 2;
      ctx.font = '8px "Press Start 2P"';
      ctx.textBaseline = "top";
      const line = `MEX 1-${eng} ENG`;
      const lw = ctx.measureText(line).width;
      const lx = Math.round(x0 + (w - lw) / 2);
      ctx.fillStyle = scene.engScored ? "#f2c94c" : "#f4f6fa";
      ctx.fillText(line, lx, y0 + 2);
      // clock, and a red card under ENG for Quansah (54')
      ctx.fillStyle = "#f2c94c";
      ctx.fillText("59:34", x0 + 8, y0 + 12);
      const engX = lx + ctx.measureText("MEX 1-2 ").width;
      R(engX + 6, y0 + 12, 5, 7, "#e0242f");
      R(engX + 6, y0 + 12, 5, 1, "#ff6b6b");
    }

    function drawAzteca(now) {
      const engJump = now < scene.crowdUntil;   // England goal
      const mexJump = now < (scene.mexUntil || 0); // Kane misses

      // night sky over Mexico City
      ["#04070d", "#060b14", "#08101c", "#0a1524"].forEach((c, i) => R(0, i * 4, W, 4, c));
      ctx.fillStyle = "rgba(70,80,100,0.35)";
      for (const [x, y, w, h] of AZ_CLOUDS) ctx.fillRect(x, y, w, h);

      // the huge roof canopy and its ring of lights
      R(0, 15, W, 6, "#12161d");
      R(0, 20, W, 1, "#2a303a");
      const glow = ctx.createLinearGradient(0, 21, 0, 40);
      glow.addColorStop(0, "rgba(255,248,220,0.22)");
      glow.addColorStop(1, "rgba(255,248,220,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 21, W, 19);
      for (let x = 3; x < W; x += 7) { R(x, 20, 3, 2, "#fffbe6"); R(x + 1, 22, 1, 1, "#fff2b0"); }

      // upper tier: a wall of fans
      R(0, 22, W, 26, "#141b26");
      for (const d of AZ_UPPER) {
        const hop = (engJump && d.x < AZ_ENG_END) || (mexJump && d.x >= AZ_ENG_END) ? (Math.sin(now / 90 + d.x) > 0 ? -1 : 0) : 0;
        R(d.x, d.y + hop, 1, 1, d.c);
      }
      drawAztecaScreen();

      // tier divider with the stadium name
      R(0, 48, W, 6, "#2b3340");
      R(0, 48, W, 1, "#3f4857");
      ctx.font = '8px "Press Start 2P"';
      ctx.textBaseline = "top";
      ctx.fillStyle = "#c8102e";
      ctx.fillText("ESTADIO AZTECA", 92, 47);

      // lower tier
      R(0, 54, W, 40, "#0e1520");
      for (const f of AZ_FANS) {
        const jumping = (engJump && f.eng) || (mexJump && !f.eng);
        let dy = 0;
        if (jumping) dy = Math.sin(now / 90 + f.ph) > 0 ? -2 : 0;
        else if (Math.sin(now / 700 + f.ph) > 0.93) dy = -1;
        R(f.x, f.y + 2 + dy, 3, 3, f.shirt);
        R(f.x, f.y + dy, 2, 2, f.skin);
        if (jumping) { R(f.x - 1, f.y - 1 + dy, 1, 2, f.skin); R(f.x + 3, f.y - 1 + dy, 1, 2, f.skin); }
      }
      for (const f of AZ_FLAGS) drawAztecaFlag(f, now);

      // advertising boards
      R(0, 94, W, 10, "#06101a");
      R(0, 94, W, 1, "#c8102e");
      ctx.font = '8px "Press Start 2P"';
      const msg = engJump ? "GOAL!  KANE!  1-3  " : "ESTADIO AZTECA  *  MEXICO CITY  *  ROUND OF 16  *  PENALTY PUNDIT  *  ";
      ctx.fillStyle = engJump ? (Math.floor(now / 150) % 2 ? "#f2c94c" : "#ffffff") : "#f4f6fa";
      const mw = Math.max(1, ctx.measureText(msg).width);
      const off = (now / (engJump ? 12 : 30)) % mw;
      for (let x = -off; x < W; x += mw) ctx.fillText(msg, Math.round(x), 95);
    }

    // =====================================================================
    //  STORY for the "azteca" theme: kicks 1-4 are young Harry Kane at
    //  Ridgeway Rovers in 2003, in the park; after kick 4 a time-jump takes
    //  you to the Azteca in 2026 for kick 5.
    // =====================================================================
    const STORY_PARK_KICKS = 4; // kicks 1-4 in the park, kick 5 at the Azteca
    let drawStage = "classic";  // which scene is being drawn this frame

    // Which scene to show right now.
    function stageNow(now) {
      if (theme !== "azteca") return "classic";
      if (scene.transition) return now - scene.transition.t0 < TRANS.SWITCH ? "park" : "azteca";
      if (screen === "end") return "azteca";
      return game.index >= STORY_PARK_KICKS ? "azteca" : "park";
    }

    // --- the park (Ridgeway Rovers, 2003) ---
    const PARK_TOWERS = [[6, 14, 16, 26], [150, 4, 22, 36], [176, 9, 17, 31], [196, 2, 23, 38], [228, 7, 20, 33], [282, 12, 18, 28]];
    const PARK_HOUSES = Array.from({ length: 64 }, (_, i) => ({ x: i * 5, h: randInt(3, 6), roof: pick(["#9a5a44", "#8a4c3a", "#a8684e", "#7f8790"]) }));
    const PARK_TREES = Array.from({ length: 48 }, (_, i) => ({ x: i * 7 + randInt(-2, 2), r: randInt(5, 8), c: pick(["#2f5a2c", "#355f2e", "#2a5228"]) }));
    const PARK_FAR_GOALS = [[24, 61], [128, 58], [252, 63], [70, 78], [206, 80]];
    const PARK_FAR_PLAYERS = Array.from({ length: 30 }, () => ({ x: randInt(4, 314), y: randInt(60, 92), c: pick(["#c8102e", "#1f4fa8", "#f4f6fa", "#f2c94c", "#222", "#7a2a6a"]), ph: rand(0, 6) }));
    const PARENTS = [
      { x: 14, coat: "#2f3b55", legs: "#3d3d3d", hair: "#3b2a1a", skin: "#f1c9a0", ph: 0.2 },
      { x: 30, coat: "#8a2f3a", legs: "#2b3a5a", hair: "#c9a06a", skin: "#e8b98a", ph: 1.4 },
      { x: 46, coat: "#4e5e3a", legs: "#3d3d3d", hair: "#6b4428", skin: "#d9a477", ph: 2.9, kid: true },
      { x: 62, coat: "#c9ced6", legs: "#2b3a5a", hair: "#1a1410", skin: "#c68642", ph: 0.8 },
      { x: 238, coat: "#1f4fa8", legs: "#3d3d3d", hair: "#8a6a45", skin: "#f1c9a0", ph: 2.1 },
      { x: 256, coat: "#f2c94c", legs: "#2b3a5a", hair: "#3b2a1a", skin: "#e8b98a", ph: 3.6 },
      { x: 274, coat: "#5a3a6a", legs: "#3d3d3d", hair: "#b0b0b0", skin: "#f1c9a0", ph: 4.4 },
      { x: 296, coat: "#2e2e2e", legs: "#2b3a5a", hair: "#6b4428", skin: "#d9a477", ph: 5.2 },
    ];

    function drawParent(p, now, cheer) {
      const fy = 111, s = p.kid ? 6 : 0; // a younger sibling is shorter
      const hop = cheer ? (Math.sin(now / 110 + p.ph) > 0 ? -2 : 0) : 0;
      const y = fy + hop;
      R(p.x - 3, y - 2, 2, 2, "#222"); R(p.x + 1, y - 2, 2, 2, "#222");
      R(p.x - 3, y - 9 + s, 6, 7 - s, p.legs);
      R(p.x - 4, y - 19 + s, 8, 10, p.coat);
      R(p.x - 2, y - 25 + s, 5, 6, p.skin);
      R(p.x - 2, y - 26 + s, 5, 2, p.hair);
      if (cheer) { R(p.x - 6, y - 26 + s, 2, 8, p.coat); R(p.x + 4, y - 26 + s, 2, 8, p.coat); }
      else { R(p.x - 6, y - 18 + s, 2, 7, p.coat); R(p.x + 4, y - 18 + s, 2, 7, p.coat); }
    }

    function drawDog(x, now, happy) {
      const bounce = happy ? (Math.floor(now / 120) % 2) * 2 : 0;
      const y = 111 - bounce;
      const wag = Math.floor(now / (happy ? 80 : 300)) % 2;
      R(x - 5, y - 6, 10, 4, "#f4efe6");        // body
      R(x - 2, y - 6, 4, 2, "#8a5a32");         // brown patch
      R(x - 5, y - 2, 2, 2, "#f4efe6"); R(x + 3, y - 2, 2, 2, "#f4efe6"); // legs
      R(x + 4, y - 10, 5, 5, "#f4efe6");        // head
      R(x + 4, y - 10, 2, 4, "#8a5a32");        // ear
      R(x + 8, y - 8, 1, 1, "#222");            // nose
      R(x - 7, y - 8 + wag, 2, 2, "#f4efe6");   // wagging tail
      if (happy) R(x + 7, y - 6, 2, 2, "#e77a8a"); // tongue out
    }

    function drawPark(now) {
      const cheer = now < scene.crowdUntil;
      // sunny sky
      ["#8fc3ea", "#9dcbee", "#acd3f1", "#bcdcf3", "#cbe4f5", "#d8eaf6"].forEach((c, i) => R(0, i * 6, W, 6, c));
      // tower blocks and rooftops on the skyline
      for (const [x, y, w, h] of PARK_TOWERS) {
        R(x, y, w, h, "#8d98a5");
        R(x + w - 3, y, 3, h, "#7c8794");
        for (let wy = y + 2; wy < y + h - 2; wy += 3) for (let wx = x + 2; wx < x + w - 3; wx += 3) R(wx, wy, 1, 1, "#b9c3cd");
      }
      for (const h of PARK_HOUSES) { R(h.x, 40 - h.h, 5, h.h, "#c9b8a6"); R(h.x, 40 - h.h - 1, 5, 1, h.roof); }
      R(0, 40, W, 3, "#a49c8e");
      // tree line
      for (const t of PARK_TREES) { disc(t.x, 46, t.r, t.c); R(t.x - 1, 48, 2, 6, "#4a3a28"); }
      R(0, 50, W, 6, "#2f5a2c");
      // the other pitches stretching away
      R(0, 56, W, 48, "#6aa346");
      for (let y = 60; y < 104; y += 8) R(0, y, W, 4, "#629b40");
      R(0, 70, W, 1, "#e8f2e0"); R(10, 92, W - 20, 1, "#e8f2e0"); R(160, 56, 1, 14, "#e8f2e0");
      for (const [gx, gy] of PARK_FAR_GOALS) { R(gx, gy, 14, 1, "#ffffff"); R(gx, gy, 1, 6, "#ffffff"); R(gx + 13, gy, 1, 6, "#ffffff"); }
      for (const p of PARK_FAR_PLAYERS) { const dx = Math.round(Math.sin(now / 900 + p.ph) * 3); R(p.x + dx, p.y, 2, 3, p.c); R(p.x + dx, p.y - 1, 2, 1, "#e8b98a"); }
    }

    // Worn grass on a well-used park pitch, then the touchline crowd in front of it.
    function drawParkWear(now) {
      ctx.globalAlpha = 0.55;
      disc(160, 150, 7, "#8f8a52"); disc(154, 151, 4, "#8f8a52"); disc(167, 149, 4, "#8f8a52");
      disc(140, 110, 3, "#8f8a52"); disc(160, 109, 5, "#8f8a52"); disc(180, 110, 3, "#8f8a52");
      ctx.globalAlpha = 1;
      R(159, 149, 3, 2, "#e8f5ea"); // penalty spot
      const cheer = now < scene.crowdUntil;
      // parents, a little brother and a dog on the touchline
      for (const p of PARENTS) drawParent(p, now, cheer);
      drawDog(84, now, cheer);
      // kit bag
      R(226, 106, 8, 5, "#1f4fa8"); R(226, 106, 8, 1, "#f4f6fa");
    }

    // --- caption cards ---
    function setCaption(lines, ms) { scene.caption = { lines, t0: performance.now(), ms }; }
    function drawCaption(now) {
      const c = scene.caption;
      if (!c) return;
      const t = now - c.t0;
      if (t > c.ms) { scene.caption = null; return; }
      const a = Math.min(1, t / 300, (c.ms - t) / 500);
      ctx.globalAlpha = Math.max(0, a) * 0.78;
      R(0, 112, W, 26, "#05070b");
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '8px "Press Start 2P"';
      ctx.textBaseline = "top";
      c.lines.forEach((ln, i) => {
        const w = ctx.measureText(ln).width;
        ctx.fillStyle = i === 0 ? "#f2c94c" : "#f4f6fa";
        ctx.fillText(ln, Math.round((W - w) / 2), 115 + i * 11);
      });
      ctx.globalAlpha = 1;
    }
    const CAPTION_PARK = ["RIDGEWAY ROVERS, 2003", "HARRY KANE"];
    const CAPTION_AZTECA = ["ESTADIO AZTECA, 2026", "59:34  MEX 1-2 ENG"];

    // --- the time-jump between kick 4 and kick 5 ---
    const TRANS = { OUT: 900, SWITCH: 1500, IN: 2300, END: 2600 };
    const TRANS_CELLS = (() => {
      const cells = [];
      for (let y = 0; y < H; y += 8) for (let x = 0; x < W; x += 8) cells.push([x, y, Math.random()]);
      return cells.sort((a, b) => a[2] - b[2]);
    })();
    function playTimeJump() {
      return new Promise((resolve) => {
        scene.transition = { t0: performance.now(), resolve, lastYear: 2003 };
        sound.whoosh();
      });
    }
    function updateTransition(now) {
      const tr = scene.transition;
      if (!tr) return;
      const t = now - tr.t0;
      const year = Math.min(2026, 2003 + Math.floor(Math.max(0, t - 500) / 40));
      if (year !== tr.lastYear) { tr.lastYear = year; sound.tick(); }
      if (!tr.roared && t >= TRANS.SWITCH) { tr.roared = true; sound.roar(); }
      if (t >= TRANS.END) { scene.transition = null; tr.resolve(); }
    }
    function drawTransition(now) {
      const tr = scene.transition;
      if (!tr) return;
      const t = now - tr.t0;
      let covered;
      if (t < TRANS.OUT) covered = t / TRANS.OUT;                       // the park breaks into pixels
      else if (t < TRANS.SWITCH) covered = 1;                             // black, counting years
      else covered = Math.max(0, 1 - (t - TRANS.SWITCH) / (TRANS.IN - TRANS.SWITCH)); // the Azteca builds in
      const n = Math.floor(TRANS_CELLS.length * covered);
      for (let i = 0; i < n; i++) { const [x, y] = TRANS_CELLS[i]; R(x, y, 8, 8, "#05070b"); }
      if (t > 300 && t < TRANS.IN) {
        drawText("FAST FORWARD", 8, "#8fa3b8", 66);
        drawText(String(tr.lastYear), 24, tr.lastYear === 2026 ? "#f4f6fa" : "#f2c94c", 80);
      }
    }

    function netShift(x, y) {
      const b = scene.bulge;
      if (!b || b.amp < 0.05) return [x, y];
      const dx = x - b.x, dy = y - b.y;
      const d2 = dx * dx + dy * dy;
      const f = b.amp * Math.exp(-d2 / 80);
      const d = Math.sqrt(d2) + 0.001;
      return [x + (dx / d) * f * 0.6, y + (dy / d) * f * 0.6 - f * 0.4];
    }

    function drawGoal() {
      R(101, 64, 118, 46, "rgba(255,255,255,0.05)");
      const net = "rgba(225,235,245,0.45)";
      for (let x = 103; x <= 217; x += 5) {
        for (let y = 64; y < 110; y++) { const [px, py] = netShift(x, y); R(px, py, 1, 1, net); }
      }
      for (let y = 67; y < 110; y += 5) {
        for (let x = 101; x < 219; x++) { const [px, py] = netShift(x, y); R(px, py, 1, 1, net); }
      }
      R(98, 111, 124, 1, "rgba(0,0,0,0.25)");
      const post = "#f4f8fc", shade = "#b9c6d3";
      R(98, 61, 3, 50, post); R(219, 61, 3, 50, post); R(98, 61, 124, 3, post);
      R(100, 64, 1, 47, shade); R(221, 64, 1, 47, shade); R(98, 63, 124, 1, shade);
    }

    const KEEPER = { skin: "#f1c27d", hair: "#2b1d14", shirt: "#f2c94c", shirt2: "#d9ad2b", glove: "#7bd389", shorts: "#1b2838" };
    // Azteca theme: Mexico's keeper, in green
    const KEEPER_MEX = { skin: "#c68642", hair: "#1a1410", shirt: "#1f8a45", shirt2: "#145a2a", glove: "#f4f6fa", shorts: "#111111" };
    // a kid keeper for the park
    const KEEPER_KID = { skin: "#f1c9a0", hair: "#6b4428", shirt: "#f28c28", shirt2: "#d0711a", glove: "#f4f6fa", shorts: "#1b2838" };
    const keeperKit = () => (drawStage === "park" ? KEEPER_KID : drawStage === "azteca" ? KEEPER_MEX : KEEPER);

    function drawKeeperStanding(x, fy) {
      const k = keeperKit();
      R(x - 5, fy - 2, 4, 2, "#111"); R(x + 1, fy - 2, 4, 2, "#111");
      R(x - 4, fy - 6, 3, 4, "#fff"); R(x + 1, fy - 6, 3, 4, "#fff");
      R(x - 4, fy - 9, 3, 3, k.skin); R(x + 1, fy - 9, 3, 3, k.skin);
      R(x - 5, fy - 13, 10, 4, k.shorts);
      R(x - 6, fy - 22, 12, 9, k.shirt); R(x - 6, fy - 14, 12, 1, k.shirt2);
      R(x - 9, fy - 21, 3, 7, k.shirt); R(x + 6, fy - 21, 3, 7, k.shirt);
      R(x - 10, fy - 15, 4, 4, k.glove); R(x + 6, fy - 15, 4, 4, k.glove);
      disc(x, fy - 27, 5, k.skin);
      R(x - 4, fy - 32, 9, 2, k.hair); R(x - 5, fy - 30, 2, 2, k.hair); R(x + 4, fy - 30, 2, 2, k.hair);
      R(x - 2, fy - 28, 1, 1, "#111"); R(x + 2, fy - 28, 1, 1, "#111");
    }

    function drawKeeperDiving(cx, cy, dir) {
      const k = keeperKit();
      const D = (lx, ly, w, h, c) => R(dir > 0 ? cx + lx : cx - lx - w, cy + ly, w, h, c);
      D(-20, -1, 2, 4, "#111");
      D(-18, -1, 4, 4, "#fff");
      D(-14, -1, 4, 4, k.skin);
      D(-10, -3, 5, 6, k.shorts);
      D(-5, -4, 11, 8, k.shirt); D(-5, 3, 11, 1, k.shirt2);
      disc(cx + dir * 10, cy - 1, 5, k.skin);
      D(6, -6, 9, 2, k.hair);
      D(5, -10, 10, 3, k.shirt);
      D(15, -12, 4, 5, k.glove);
    }

    const KICKER = { skin: "#e8b98a", hair: "#3b2a1a", hairHi: "#5a4330", shirt: "#8cc4f0", shirtD: "#5f9fd0", shorts: "#f4f8fc", socks: "#1b2838", navy: "#0b1622" };
    // Azteca theme: Harry Kane in an England-style white shirt (no crests or logos)
    const KICKER_KANE = { skin: "#e8b98a", hair: "#8a6a45", hairHi: "#ad8a5e", shirt: "#f4f6fa", shirtD: "#d3d9e2", shorts: "#1b2b55", socks: "#f4f6fa", navy: "#1b2b55", trim: "#cf142b", name: "KANE", number: "9" };
    // Young Kane at Ridgeway Rovers: blue-and-white halves, buzz cut (no sponsor)
    const KICKER_KID = { skin: "#efc39a", hair: "#c9a06a", hairHi: "#dcb889", shirt: "#f4f6fa", shirtD: "#d3d9e2", halves: "#1f4fa8", shorts: "#f4f6fa", socks: "#f4f6fa", navy: "#1b2b55" };
    const kickerKit = () => (drawStage === "park" ? KICKER_KID : drawStage === "azteca" ? KICKER_KANE : KICKER);

    // Tiny pixel font for names on shirts: letters 4 rows high, digits 5; N is 4 wide.
    const SHIRT_FONT = {
      K: ["#.#", "##.", "#.#", "#.#"],
      A: [".#.", "#.#", "###", "#.#"],
      N: ["#..#", "##.#", "#.##", "#..#"],
      E: ["###", "##.", "#..", "###"],
      9: ["###", "#.#", "###", "..#", "###"],
    };
    function drawShirtText(text, x, y, color) {
      let cx = x;
      for (const ch of text) {
        const rows = SHIRT_FONT[ch];
        if (!rows) continue;
        rows.forEach((row, ry) => {
          [...row].forEach((px, rx) => { if (px === "#") R(cx + rx, y + ry, 1, 1, color); });
        });
        cx += rows[0].length + 1;
      }
    }

    function kickerLeg(xl, fy, lift) {
      const k = kickerKit();
      const bottom = fy - lift;
      const skinH = Math.max(1, bottom - 5 - (fy - 9));
      R(xl, fy - 9, 3, skinH, k.skin);
      R(xl, bottom - 5, 3, 3, k.socks);
      R(xl - 1, bottom - 2, 4, 2, "#111");
    }

    function drawKicker(x, fy, pose, now) {
      const k = kickerKit();
      // legs
      if (pose === "runA") { kickerLeg(x - 5, fy, 0); kickerLeg(x + 2, fy, 3); }
      else if (pose === "runB") { kickerLeg(x - 5, fy, 3); kickerLeg(x + 2, fy, 0); }
      else if (pose === "kick") { kickerLeg(x - 5, fy, 0); kickerLeg(x + 3, fy, 7); }
      else { kickerLeg(x - 5, fy, 0); kickerLeg(x + 2, fy, 0); }

      const w = k.name ? 1 : 0; // a named shirt is 2px wider so the name fits
      R(x - 6, fy - 13, 13, 5, k.shorts);
      R(x - 7 - w, fy - 24, 15 + 2 * w, 11, k.shirt);
      R(x + 6 + w, fy - 24, 2, 11, k.shirtD);
      if (k.halves) R(x, fy - 24, 8 + w, 11, k.halves); // Ridgeway Rovers halves
      if (k.name) {
        // name and number on the back, e.g. KANE 9
        drawShirtText(k.name, x - 8, fy - 23, k.navy);
        drawShirtText(k.number, x - 1, fy - 18, k.navy);
      } else if (!k.halves) {
        // number 10
        R(x - 4, fy - 22, 1, 5, k.navy); R(x - 5, fy - 21, 1, 1, k.navy);
        R(x - 1, fy - 22, 4, 1, k.navy); R(x - 1, fy - 18, 4, 1, k.navy);
        R(x - 1, fy - 22, 1, 5, k.navy); R(x + 2, fy - 22, 1, 5, k.navy);
      }

      // arms
      const ax = x - 9 - w, bx = x + 8 + w; // arm positions
      if (pose === "celebrate") {
        const bob = Math.floor(now / 140) % 2;
        R(ax, fy - 34 - bob, 2, 11, k.skin); R(bx, fy - 34 + bob, 2, 11, k.skin);
        R(ax, fy - 24, 2, 3, k.shirt); R(bx, fy - 24, 2, 3, k.shirt);
      } else {
        const swing = pose === "runA" ? 2 : pose === "runB" ? -2 : pose === "kick" ? -3 : 0;
        R(ax, fy - 24, 2, 3, k.shirt); R(ax, fy - 21 + swing, 2, 5, k.skin);
        R(bx, fy - 24, 2, 3, k.shirt); R(bx, fy - 21 - swing, 2, 5, k.skin);
      }
      if (k.halves) R(bx, fy - 24, 2, 3, k.halves); // blue sleeve on the blue half
      if (k.trim) { R(ax, fy - 22, 2, 1, k.trim); R(bx, fy - 22, 2, 1, k.trim); } // red sleeve cuffs

      // big head (seen from behind)
      const hy = pose === "sad" ? fy - 32 : fy - 34;
      R(x - 2, fy - 26, 5, 2, k.skin);
      disc(x, hy, 9, k.hair);
      R(x - 4, hy + 7, 9, 2, k.skin);
      R(x - 10, hy, 2, 3, k.skin); R(x + 9, hy, 2, 3, k.skin);
      R(x - 4, hy - 7, 5, 1, k.hairHi); R(x - 6, hy - 5, 2, 1, k.hairHi);
    }

    function drawBall(x, y, r) {
      if (r >= 3) {
        disc(x, y, 3, "#ffffff");
        R(x - 1, y - 1, 2, 2, "#222");
        R(x + 2, y + 1, 1, 1, "#555");
        R(x - 2, y + 2, 1, 1, "#555");
      } else if (r === 2) {
        disc(x, y, 2, "#ffffff");
        R(x, y, 1, 1, "#333");
      } else {
        R(x, y, 2, 2, "#ffffff");
      }
    }

    function drawText(text, size, color, y) {
      ctx.font = `${size}px "Press Start 2P"`;
      ctx.textBaseline = "top";
      const w = ctx.measureText(text).width;
      const x = Math.round((W - w) / 2);
      ctx.fillStyle = "#000";
      ctx.fillText(text, x + 2, y + 2);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
    }

    // --- scene state -----------------------------------------------------

    const scene = { kick: null, banner: null, confetti: [], crowdUntil: 0, bulge: null, overlay: null, engScored: false, mexUntil: 0 };

    const RUN = 850, FLIGHT = 480, ARRIVE = RUN + FLIGHT;

    const BANNERS = {
      goal: { text: "GOAL!", color: "#f2c94c" },
      save: { text: "SAVED!", color: "#ff6b6b" },
      post: { text: "OFF THE POST!", color: "#ff6b6b" },
      over: { text: "OVER THE BAR!", color: "#ff6b6b" },
      wide: { text: "WIDE!", color: "#ff6b6b" },
    };

    function resetScene() {
      scene.kick = null;
      scene.banner = null;
      scene.bulge = null;
      scene.crowdUntil = 0;
      scene.confetti = [];
      scene.engScored = false; // Azteca big screen goes back to 1-2 for the next kick
      scene.mexUntil = 0;
      scene.caption = null;
    }

    function startKick(scored) {
      scene.caption = null; // clear the caption card for the kick itself
      const side = Math.random() < 0.5 ? -1 : 1;
      const type = scored ? "goal" : pick(["save", "save", "post", "over", "wide"]);
      let tx, ty, kDir;
      switch (type) {
        case "goal": tx = 160 + side * randInt(26, 50); ty = randInt(70, 100); kDir = Math.random() < 0.2 ? 0 : -side; break;
        case "save": tx = 160 + side * randInt(20, 42); ty = randInt(76, 98); kDir = side; break;
        case "post": tx = side > 0 ? 220 : 99; ty = randInt(72, 100); kDir = pick([-1, 1]); break;
        case "over": tx = 160 + side * randInt(0, 40); ty = 40; kDir = pick([-1, 1, 0]); break;
        default: tx = side > 0 ? 238 : 82; ty = randInt(84, 104); kDir = pick([-1, 1]); break;
      }
      let kTx = 160, kTy = 93;
      if (type === "save") { kTx = tx - kDir * 17; kTy = ty + 10; }
      else if (kDir !== 0) { kTx = 160 + kDir * randInt(26, 40); kTy = randInt(80, 96); }

      return new Promise((resolve) => {
        scene.kick = { t0: performance.now(), type, side, tx, ty, kDir, kTx, kTy, kicked: false, arrived: false, resolved: false, resolve };
      });
    }

    function onArrive(k, now) {
      scene.banner = { ...BANNERS[k.type], t0: now };
      if (k.type === "goal") {
        sound.goal();
        scene.crowdUntil = now + 2600;
        scene.bulge = { x: k.tx, y: k.ty, amp: 6 };
        scene.engScored = true;
        const colors = drawStage === "azteca" ? ["#ffffff", "#cf142b", "#ffffff", "#1b2b55", "#f2c94c"]
          : drawStage === "park" ? ["#1f4fa8", "#ffffff", "#1f4fa8", "#f2c94c"]
          : ["#f2c94c", "#8cc4f0", "#ffffff", "#5fd38d", "#ff6b6b"];
        for (let i = 0; i < 90; i++) {
          scene.confetti.push({ x: rand(20, 300), y: rand(-30, 0), vx: rand(-0.03, 0.03), vy: rand(0.02, 0.07), c: pick(colors), life: rand(1800, 2800) });
        }
      } else if (k.type === "post") sound.post();
      else if (k.type === "save") sound.save();
      else sound.miss();
      if (k.type !== "goal") scene.mexUntil = now + 2200; // the home crowd celebrates a Kane miss
    }

    // positions for the current frame
    function layout(now) {
      const out = {
        kicker: { x: 128, fy: 178, pose: "stand" },
        keeper: { mode: "stand", x: 160 + Math.round(Math.sin(now / 450) * 3), fy: 110 },
        ball: { x: 160, y: 150, r: 3, shadow: true, show: true },
      };
      const k = scene.kick;
      if (!k) return out;
      const t = now - k.t0;

      // kicker
      if (t < RUN) {
        const p = easeInOut(clamp01(t / RUN));
        out.kicker = { x: lerp(128, 148, p), fy: lerp(178, 160, p), pose: Math.floor(t / 110) % 2 ? "runA" : "runB" };
      } else if (t < RUN + 260) {
        out.kicker = { x: 148, fy: 160, pose: "kick" };
      } else {
        out.kicker = { x: 148, fy: 160, pose: k.arrived ? (k.type === "goal" ? "celebrate" : "sad") : "stand" };
      }

      // keeper
      const diveStart = RUN + 40, diveDur = 450;
      if (t < diveStart) {
        out.keeper = { mode: "stand", x: 160, fy: 110 };
      } else if (k.kDir === 0) {
        const p = clamp01((t - diveStart) / diveDur);
        out.keeper = { mode: "stand", x: 160, fy: 110 - Math.round(5 * Math.sin(Math.PI * p)) };
      } else {
        const p = clamp01((t - diveStart) / diveDur);
        if (p < 0.18) {
          out.keeper = { mode: "stand", x: 160 + k.kDir * 2, fy: 111 };
        } else {
          const e = easeOut((p - 0.18) / 0.82);
          let cx = lerp(160, k.kTx, e);
          let cy = lerp(95, k.kTy, e) - 6 * Math.sin(Math.PI * e);
          const fall = clamp01((t - diveStart - diveDur - 250) / 300);
          cy = lerp(cy, 104, easeOut(fall));
          out.keeper = { mode: "dive", x: cx, y: cy, dir: k.kDir };
        }
      }

      // ball
      if (t < RUN + 60) {
        out.ball = { x: 160, y: 150, r: 3, shadow: true, show: true };
      } else if (t < ARRIVE + 60) {
        const p = clamp01((t - RUN - 60) / FLIGHT);
        out.ball = {
          x: lerp(160, k.tx, p),
          y: lerp(150, k.ty, p) - 10 * Math.sin(Math.PI * p),
          r: p < 0.5 ? 3 : 2,
          shadow: true,
          sy: lerp(152, 111, p),
          show: true,
        };
      } else {
        const dt = t - ARRIVE - 60;
        let x = k.tx, y = k.ty, r = 2, show = true;
        switch (k.type) {
          case "goal": {
            const push = clamp01(dt / 200);
            x = k.tx + (k.tx - 160) * 0.04 * push;
            y = k.ty - 2 * push;
            if (dt > 250) y = lerp(k.ty - 2, 107, easeOut(clamp01((dt - 250) / 400)));
            break;
          }
          case "save": x = k.tx + k.side * 0.08 * dt; y = k.ty + 0.05 * dt; r = dt > 300 ? 3 : 2; break;
          case "post": x = k.tx + k.side * 0.1 * dt; y = k.ty + 0.07 * dt; r = dt > 300 ? 3 : 2; break;
          case "over": x = k.tx + k.side * 0.02 * dt; y = k.ty - 0.08 * dt; r = dt > 200 ? 1 : 2; break;
          default: x = k.tx + k.side * 0.08 * dt; y = k.ty - 0.01 * dt; break;
        }
        if (x < -10 || x > W + 10 || y < -10 || y > H + 10) show = false;
        out.ball = { x, y, r, shadow: false, show };
      }
      return out;
    }

    function update(now, dt) {
      const k = scene.kick;
      if (k) {
        const t = now - k.t0;
        if (!k.kicked && t >= RUN + 60) { k.kicked = true; sound.kick(); }
        if (!k.arrived && t >= ARRIVE + 60) { k.arrived = true; onArrive(k, now); }
        if (!k.resolved && t >= ARRIVE + 700) { k.resolved = true; k.resolve(); }
      }
      updateTransition(now);
      if (scene.bulge) scene.bulge.amp *= Math.pow(0.992, dt);
      scene.confetti = scene.confetti.filter((p) => (p.life -= dt) > 0 && p.y < H + 4);
      for (const p of scene.confetti) {
        p.x += p.vx * dt + Math.sin((now + p.life) / 200) * 0.15;
        p.y += p.vy * dt;
      }
    }

    function draw(now) {
      drawStage = stageNow(now);
      if (drawStage === "azteca") {
        drawAzteca(now);
      } else if (drawStage === "park") {
        drawPark(now);
      } else {
        drawBackground(now);
        drawStand(now);
        drawBoards(now);
      }
      drawPitch();
      if (drawStage === "park") drawParkWear(now);
      drawGoal();

      const L = layout(now);
      if (L.keeper.mode === "dive") drawKeeperDiving(L.keeper.x, L.keeper.y, L.keeper.dir);
      else drawKeeperStanding(L.keeper.x, L.keeper.fy);

      if (L.ball.show) {
        if (L.ball.shadow) R(L.ball.x - 2, (L.ball.sy || 152) + 1, 5, 1, "rgba(0,0,0,0.35)");
        drawBall(Math.round(L.ball.x), Math.round(L.ball.y), L.ball.r);
      }

      drawKicker(Math.round(L.kicker.x), Math.round(L.kicker.fy), L.kicker.pose, now);

      for (const p of scene.confetti) R(p.x, p.y, 2, 2, p.c);

      if (scene.banner) {
        const b = scene.banner;
        const size = b.text.length > 8 ? 16 : 24;
        const color = b.text === "GOAL!" && Math.floor(now / 150) % 2 ? "#ffffff" : b.color;
        const age = now - b.t0;
        // On the Azteca the big screen sits where banners normally go, so banners use the sky.
        const top = drawStage === "azteca" ? (size === 24 ? 0 : 3) : 22;
        const y = age < 200 ? Math.round(lerp(-30, top, easeOut(age / 200))) : top;
        drawText(b.text, size, color, y);
      } else if (scene.overlay && Math.floor(now / 600) % 2 === 0) {
        drawText(scene.overlay, 16, "#f2c94c", drawStage === "azteca" ? 3 : 22);
      }

      drawCaption(now);
      drawTransition(now);
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(50, now - last);
      last = now;
      update(now, dt);
      draw(now);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // =====================================================================
    //  GAME FLOW (one shootout a day)
    // =====================================================================

    const panel = $("#panel");
    const pipsEl = $("#pips");
    const goalsEl = $("#goals");
    const soundBtn = $("#soundBtn");

    let today = null; // { iso, number, questions }
    let bootedOn = null;
    let game = { results: [], index: 0, active: false, busy: false };

    const LEVEL = { easy: "EASY", medium: "MEDIUM", hard: "HARD" };
    const lvl = (level) => `<span class="lvl ${level}">${LEVEL[level]}</span>`;

    // Each day's kicks are saved as they happen, so a refresh can't re-take a penalty.
    const dayKey = (iso) => "pp-day-" + iso;
    function loadDay(iso) {
      try { return JSON.parse(store.get(dayKey(iso)) || "null"); } catch (e) { return null; }
    }
    function saveDay(iso, data) { store.set(dayKey(iso), JSON.stringify(data)); }

    function renderPips() {
      pipsEl.innerHTML = KICKS.map((_, i) => {
        const r = game.results[i];
        const cls = r && i < game.index + (game.busy ? 0 : 1) ? (r.scored ? "goal" : "miss") : (game.active && i === game.index ? "now" : "");
        return `<span class="pip ${cls}"></span>`;
      }).join("");
      goalsEl.textContent = game.results.filter((r, i) => r.scored && i < game.index + (game.busy ? 0 : 1)).length;
    }

    function bandsHtml() {
      const bands = [...SCORING_BANDS].sort((a, b) => a.within - b.within);
      const rows = bands.map((b) => {
        const label = b.within === 0 ? "Bang on" : `${b.within} either side`;
        return `<span>${label}</span><b>${b.chance}% chance of scoring</b>`;
      });
      rows.push(`<span>Further out</span><b class="zero">Missed penalty</b>`);
      return rows.join("");
    }

    // ---- stats across every day played on this device
    function playedDays() {
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith("pp-day-")) continue;
          const d = loadDay(k.slice(7));
          if (d && d.done) out.push({ iso: k.slice(7), score: d.results.filter((r) => r.scored).length });
        }
      } catch (e) { /* storage blocked */ }
      // Count today's finished shootout even if the browser wouldn't let us save it.
      if (today && game.results.length >= KICKS.length && !out.some((d) => d.iso === today.iso)) {
        out.push({ iso: today.iso, score: game.results.filter((r) => r.scored).length });
      }
      return out.sort((a, b) => a.iso.localeCompare(b.iso));
    }

    function stats() {
      const days = playedDays();
      let best = 0, run = 0, prev = null;
      for (const d of days) {
        run = prev !== null && dayNum(d.iso) - dayNum(prev) === 1 ? run + 1 : 1;
        best = Math.max(best, run);
        prev = d.iso;
      }
      const gap = prev ? dayNum(todayIso()) - dayNum(prev) : Infinity;
      const total = days.reduce((s, d) => s + d.score, 0);
      return { played: days.length, avg: days.length ? total / days.length : 0, streak: gap <= 1 ? run : 0, best };
    }

    function statsHtml() {
      const s = stats();
      return `
        <div class="statbox">
          <div><b>${s.played}</b><span>PLAYED</span></div>
          <div><b>${s.played ? s.avg.toFixed(1) : "-"}</b><span>AVERAGE</span></div>
          <div><b>${s.streak}</b><span>STREAK</span></div>
          <div><b>${s.best}</b><span>BEST STREAK</span></div>
        </div>`;
    }

    // ---- countdowns
    const fmtCountdown = (ms) => {
      const s = Math.max(0, Math.floor(ms / 1000));
      return `${pad(Math.floor(s / 3600))}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
    };
    let screen = "none"; // which screen is showing: none | title | question | end
    function tickCountdown() {
      const el = $("#countdown");
      if (el) {
        const left = Number(el.dataset.target) - Date.now();
        el.textContent = fmtCountdown(left);
        // On a result screen, don't whisk the result away at midnight: offer a button instead.
        if (left <= 0 && screen === "end" && !el.dataset.ready) {
          el.dataset.ready = "1";
          el.parentElement.innerHTML = `TODAY'S SHOOTOUT IS READY<br><button class="btn" id="todayBtn" type="button">PLAY TODAY'S SHOOTOUT</button>`;
          $("#todayBtn").addEventListener("click", boot);
        }
      }
      // A new day has started while the page was open: move on, unless someone is
      // mid-shootout or looking at their result.
      if (bootedOn && todayIso() !== bootedOn && (screen === "title" || screen === "none")) boot();
    }
    setInterval(tickCountdown, 1000);

    // ---- screens
    function boot() {
      bootedOn = todayIso();
      theme = THEME_DAYS[bootedOn] || "classic";
      document.body.classList.toggle("theme-azteca", theme === "azteca");
      today = shootoutFor(bootedOn);
      resetScene();
      if (!today) { showNoShootout(); return; }
      const saved = loadDay(today.iso);
      const results = saved ? saved.results : [];
      game = { results, index: results.length, active: false, busy: false };
      if (saved && saved.done) showEnd(false);
      else showTitle();
    }

    function showNoShootout() {
      screen = "none";
      game = { results: [], index: 0, active: false, busy: false };
      scene.overlay = null;
      const before = dayIndex(bootedOn) < 0;
      panel.innerHTML = `
        <h1 class="title">PENALTY PUNDIT</h1>
        <p class="tag">Guess the Answer. Take the penalty.</p>
        ${before
          ? `<p class="daily">DAILY SHOOTOUT #1 KICKS OFF ${prettyDate(DAILY_START)}</p>
             <p class="countdown-big" id="countdown" data-target="${localMidnight(DAILY_START)}"></p>`
          : `<p class="daily">NO SHOOTOUT TODAY</p><p class="hint">New questions are on their way. Check back soon.</p>`}
        ${playedDays().length ? statsHtml() : ""}
        <p class="hint">Can't wait? <a href="editions/timberyard.html">Play the Timberyard special</a>.</p>
      `;
      tickCountdown();
      renderPips();
    }

    function showTitle() {
      screen = "title";
      scene.overlay = "PRESS START";
      const resuming = game.results.length > 0;
      panel.innerHTML = `
        <h1 class="title">PENALTY PUNDIT</h1>
        <p class="daily">DAILY SHOOTOUT #${today.number} &middot; ${prettyDate(today.iso)}</p>
        ${theme === "azteca" ? (game.index >= STORY_PARK_KICKS
          ? `<p class="theme-line"><b>ESTADIO AZTECA, 2026</b> &middot; 59:34 &middot; MEX 1-2 ENG <span class="rc" aria-label="England down to 10 men"></span></p>`
          : `<p class="theme-line"><b>RIDGEWAY ROVERS, 2003</b> &middot; HARRY KANE</p>`) : ""}
        <p class="tag">Guess the Answer. Take the penalty.</p>
        <div class="rules">${bandsHtml()}</div>
        <p class="levels">${KICKS.map(lvl).join(" ")}</p>
        <p class="hint small">One shootout a day. The kicks get harder as you go.</p>
        <div><button class="btn" id="startBtn" type="button">${resuming ? `CARRY ON: KICK ${game.index + 1}` : "START"}</button></div>
      `;
      $("#startBtn").addEventListener("click", startGame);
      if (theme === "azteca") setCaption(game.index >= STORY_PARK_KICKS ? CAPTION_AZTECA : CAPTION_PARK, Infinity);
      renderPips();
    }

    function startGame() {
      sound.init();
      sound.start();
      game.active = true;
      showQuestion();
    }

    function showQuestion() {
      screen = "question";
      resetScene();
      scene.overlay = null;
      renderPips();
      const q = today.questions[game.index];
      const story = theme === "azteca"
        ? (game.index < STORY_PARK_KICKS
          ? `<p class="theme-line"><b>RIDGEWAY ROVERS, 2003</b> &middot; HARRY KANE</p>`
          : `<p class="theme-line"><b>ESTADIO AZTECA, 2026</b> &middot; 59:34 &middot; MEX 1-2 ENG <span class="rc" aria-label="England down to 10 men"></span></p>`)
        : "";
      if (theme === "azteca" && game.index === 0) setCaption(CAPTION_PARK, 3500);
      if (theme === "azteca" && game.index === STORY_PARK_KICKS) setCaption(CAPTION_AZTECA, 4000);
      panel.innerHTML = `
        <p class="meta">KICK ${game.index + 1} OF ${KICKS.length} &middot; ${lvl(q.level)}</p>
        ${story}
        <p class="q">${q.q}</p>
        <form id="guessForm" autocomplete="off" novalidate>
          <div class="row">
            <div class="guess-wrap">
              ${q.prefix ? `<span class="affix" aria-hidden="true">${q.prefix}</span>` : ""}
              <input id="guess" class="guess${q.prefix || q.suffix ? " has-affix" : ""}" type="text" inputmode="numeric" maxlength="4" placeholder="?" aria-label="Your answer${q.suffix ? ` in ${q.prefix || ""}${q.suffix}` : ""}">
              ${q.suffix ? `<span class="affix" aria-hidden="true">${q.suffix}</span>` : ""}
            </div>
            <button class="btn" type="submit">SHOOT</button>
          </div>
        </form>
        <p class="hint">Bang on scores for sure. The closer you are, the better your chances.</p>
      `;
      const input = $("#guess");
      input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, ""); });
      $("#guessForm").addEventListener("submit", (e) => { e.preventDefault(); submitGuess(); });
      input.focus({ preventScroll: true });
    }

    function runMeter(chance, scored) {
      const needle = $("#needle");
      let final;
      if (chance >= 100 || chance <= 0) final = rand(8, 92);
      else if (scored) final = rand(Math.min(2, chance / 2), Math.max(chance - 2, chance / 2));
      else final = rand(Math.min(chance + 2, 98), 98);
      const D = 1500, travel = 200 + final;
      return new Promise((resolve) => {
        const t0 = performance.now();
        let lastTick = 0;
        function step(now) {
          const p = clamp01((now - t0) / D);
          const s = easeOut(p) * travel;
          const m = s % 200;
          needle.style.left = (m <= 100 ? m : 200 - m) + "%";
          if (now - lastTick > 70 + p * 160 && p < 0.97) { sound.tick(); lastTick = now; }
          if (p < 1) requestAnimationFrame(step);
          else resolve();
        }
        requestAnimationFrame(step);
      });
    }

    async function submitGuess() {
      if (game.busy) return;
      const input = $("#guess");
      const val = input.value.trim();
      if (!/^\d{1,4}$/.test(val)) {
        input.classList.remove("shake");
        void input.offsetWidth;
        input.classList.add("shake");
        input.focus();
        return;
      }
      game.busy = true;
      sound.init();

      const q = today.questions[game.index];
      const guess = parseInt(val, 10);
      const diff = Math.abs(guess - q.a);
      const chance = chanceFor(diff, q.bands);
      const scored = Math.random() * 100 < chance;

      // lock the result in straight away
      game.results.push({ guess, diff, chance, scored });
      saveDay(today.iso, { results: game.results, done: game.results.length >= KICKS.length });

      sound.whistle();
      panel.innerHTML = `
        <div class="reveal-grid">
          <div class="stat"><p class="label">YOU SAID</p><p class="value">${show(guess, q)}</p></div>
          <div class="stat answer"><p class="label">ANSWER</p><p class="value">${show(q.a, q)}</p></div>
        </div>
        <p class="verdict ${diff === 0 ? "exact" : ""}">${diff === 0 ? "BANG ON!" : `${howFar(diff, q)} OUT`}</p>
        <div class="meter-wrap">
          <div class="meter"><div class="zone" style="width:${chance}%"></div><div class="needle" id="needle" style="left:0%"></div></div>
          <div class="meter-label"><span>SCORING CHANCE</span><span>${chance}%</span></div>
        </div>
        <div id="after"></div>
      `;

      await sleep(700);
      await runMeter(chance, scored);
      await sleep(250);
      await startKick(scored);

      game.busy = false;
      renderPips();

      const isLast = game.index >= KICKS.length - 1;
      const banner = BANNERS[scene.kick.type];
      $("#after").innerHTML = `
        <p class="result ${scored ? "goal" : "miss"}">${banner.text}</p>
        ${q.fact ? `<p class="fact">${q.fact}</p>` : ""}
        <button class="btn" id="nextBtn" type="button">${isLast ? "FULL TIME" : "NEXT KICK"}</button>
      `;
      const next = $("#nextBtn");
      const forKick = game.index;
      next.addEventListener("click", () => {
        // Works once, and only for the kick it belongs to (stops a double tap skipping a question).
        if (next.disabled || game.index !== forKick) return;
        next.disabled = true;
        game.index++;
        if (game.index >= KICKS.length) showEnd(true);
        else if (theme === "azteca" && game.index === STORY_PARK_KICKS) {
          // Story mode: fast-forward from the park in 2003 to the Azteca in 2026.
          resetScene();
          panel.innerHTML = `<p class="meta">FAST FORWARD</p><p class="q">2003 &rarr; 2026</p>`;
          playTimeJump().then(showQuestion);
        } else showQuestion();
      });
      next.focus({ preventScroll: true });
    }

    function rankFor(score, total) {
      const r = score / total;
      if (r === 1) return "PERFECT! GOLDEN BOOT";
      if (r >= 0.8) return "WORLD CLASS";
      if (r >= 0.6) return "PREMIER LEAGUE";
      if (r >= 0.4) return "CHAMPIONSHIP";
      if (r >= 0.2) return "SUNDAY LEAGUE";
      return "BACK TO TRAINING";
    }

    // How far out a guess was, and which way: "+2" too high, "−3" too low, "0" bang on.
    const offBy = (d, q) => (d === 0 ? "0" : `${d > 0 ? "+" : "−"}${q.prefix || ""}${Math.abs(d)}${q.short || ""}`);

    // Result icons: a ball for a goal, an X for a miss, coloured by how close the guess was.
    // Green = bang on, yellow = 1 off, orange = 2 off, red = 3 off, grey = further out.
    const CLOSENESS = [
      { colour: "#5fd38d", square: "🟩", label: "Bang on" },
      { colour: "#f2c94c", square: "🟨", label: "1 off" },
      { colour: "#f2994a", square: "🟧", label: "2 off" },
      { colour: "#ff6b6b", square: "🟥", label: "3 off" },
    ];
    const FURTHER = { colour: "#6b7f93", square: "⬛", label: "Further out" };
    const closeness = (diff) => CLOSENESS[diff] || FURTHER;

    function resultIcon(r, size) {
      const c = closeness(r.diff);
      const label = `${r.scored ? "Scored" : "Missed"}, ${c.label.toLowerCase()}`;
      const svg = (inner) => `<svg class="ricon" width="${size}" height="${size}" viewBox="0 0 16 16" role="img" aria-label="${label}"><title>${label}</title>${inner}</svg>`;
      if (r.scored) {
        return svg(
          `<circle cx="8" cy="8" r="7" fill="${c.colour}" stroke="#0b1622" stroke-width="1"/>` +
          `<path d="M8 5l2.4 1.7-.9 2.8H6.5l-.9-2.8z" fill="#0b1622"/>` +
          `<path d="M8 1.2V5M10.4 6.7l3.7-1.2M9.5 9.5l2.3 3.2M6.5 9.5l-2.3 3.2M5.6 6.7L1.9 5.5" stroke="#0b1622" stroke-width="0.9"/>`
        );
      }
      return svg(`<path d="M3 3l10 10M13 3L3 13" stroke="${c.colour}" stroke-width="3.4" stroke-linecap="square"/>`);
    }

    const iconsFor = (results, size) => results.map((r) => resultIcon(r, size)).join("");
    const legendHtml = () => `
      <p class="legend">${[...CLOSENESS, FURTHER].map((c) => `<span><i style="background:${c.colour}"></i>${c.label.toUpperCase()}</span>`).join("")}</p>`;
    // Share text: a colour row for closeness, then the goals and misses.
    const shareRows = (results) => [
      results.map((r) => closeness(r.diff).square).join(""),
      results.map((r) => (r.scored ? "⚽" : "❌")).join(""),
    ].join("\n");

    function showEnd(fresh) {
      screen = "end";
      game.active = false;
      game.index = KICKS.length;
      resetScene();
      const total = KICKS.length;
      const score = game.results.filter((r) => r.scored).length;

      if (fresh) {
        sound.finalWhistle();
        if (score / total >= 0.6) {
          scene.crowdUntil = performance.now() + 3000;
          sound.goal();
        }
      }
      scene.overlay = "FULL TIME";
      renderPips();

      const tomorrow = addDays(today.iso, 1);
      const more = !!shootoutFor(tomorrow);
      const rows = today.questions.map((q, i) => {
        const r = game.results[i];
        return `
        <li>
          <span class="ri">${resultIcon(r, 16)}</span>
          <span>${q.q} ${lvl(q.level)}</span>
          <span class="num">${show(r.guess, q)}</span>
          <span class="ans">${show(q.a, q)}</span>
          <span class="off" style="color:${closeness(r.diff).colour}">${offBy(r.guess - q.a, q)}</span>
        </li>`;
      }).join("");

      panel.innerHTML = `
        <p class="meta">DAILY SHOOTOUT #${today.number} &middot; FULL TIME</p>
        <p class="final">${score} / ${total}</p>
        <p class="rank">${rankFor(score, total)}</p>
        <p class="grid" aria-label="${score} of ${total} penalties scored">${iconsFor(game.results, 34)}</p>
        ${legendHtml()}
        <div class="actions"><button class="btn" id="shareBtn" type="button">SHARE RESULT</button></div>
        ${statsHtml()}
        ${more
          ? `<p class="next">NEXT SHOOTOUT IN <b id="countdown" data-target="${localMidnight(tomorrow)}"></b></p>`
          : `<p class="next">THAT'S THE LAST SHOOTOUT FOR NOW. NEW ONES COMING SOON.</p>`}
        <ul class="recap">
          <li class="head"><span></span><span>QUESTION</span><span class="num">YOU</span><span class="ans">ANS</span><span class="off">OFF BY</span></li>
          ${rows}
        </ul>
      `;
      $("#shareBtn").addEventListener("click", () => shareScore(score, total));
      $("#shareBtn").focus({ preventScroll: true });
      tickCountdown();
    }

    async function shareScore(score, total) {
      const url = location.origin + location.pathname;
      const text = `Penalty Pundit #${today.number} ${score}/${total}\n${shareRows(game.results)}`;
      const btn = $("#shareBtn");
      try {
        if (navigator.share) {
          await navigator.share({ title: "Penalty Pundit", text, url });
          return;
        }
        await navigator.clipboard.writeText(`${text}\n${url}`);
        btn.textContent = "COPIED!";
      } catch (e) {
        if (e && e.name === "AbortError") return;
        btn.textContent = "COPY FAILED";
      }
      setTimeout(() => { btn.textContent = "SHARE RESULT"; }, 2000);
    }

    function renderSoundBtn() {
      soundBtn.textContent = sound.on ? "SOUND ON" : "SOUND OFF";
      soundBtn.setAttribute("aria-pressed", String(sound.on));
    }
    soundBtn.addEventListener("click", () => {
      sound.on = !sound.on;
      store.set("pp-sound", sound.on ? "on" : "off");
      if (sound.on) { sound.init(); sound.tick(); }
      renderSoundBtn();
    });

    renderSoundBtn();
    boot();
  })();
  </script>
</body>
</html>
